<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>장부 — 프로토타입</title>
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a333d; --fg:#dbe4ec; --dim:#8598a8;
          --ok:#3fb97f; --dead:#e06565; --inject:#e0a53f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,'Malgun Gothic',sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  nav a { color:var(--dim); margin-right:10px; text-decoration:none; font-size:13px; }
  nav a.here { color:var(--fg); }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           padding:4px 8px; border-radius:4px; }
  main { padding:16px 20px; max-width:1000px; }
  .banner { background:var(--panel); border:1px solid var(--inject); border-radius:6px;
            padding:8px 12px; margin-bottom:14px; color:var(--inject); font-size:13px; }
  .stage { background:var(--panel); border:1px solid var(--line); border-radius:6px;
           padding:10px 14px; margin-bottom:12px; }
  .stage h2 { margin:0 0 6px; font-size:14px; }
  .chip { display:inline-block; border:1px solid var(--dead); color:var(--dead);
          border-radius:8px; padding:1px 8px; font-size:12px; margin:2px 4px 2px 0; }
  .chip.ok { border-color:var(--ok); color:var(--ok); }
  .meta { color:var(--dim); font-size:12px; }
  pre.block { background:#0c1013; border:1px solid var(--line); border-radius:6px;
              padding:10px; white-space:pre-wrap; font-size:12.5px; color:#c9d6e2; }
  .inj { border-color:var(--inject); }
</style>
</head>
<body>
<header>
  <h1>장부 <span style="color:var(--inject);font-size:12px">— 프로토타입 (라운드별 소실 장부 · 재주입 성과)</span></h1>
  <nav><a href="/biography">전기</a><a class="here" href="/ledger">장부</a><a href="/transmission">레이더</a></nav>
  <select id="runsel"><option>run 로딩…</option></select>
</header>
<main id="main"><p class="meta">로딩…</p></main>
<script>
async function loadRuns() {
  const data = await (await fetch("/api/runs")).json();
  const sel = document.getElementById("runsel"); sel.innerHTML = "";
  const el = data.runs.filter(r => r.parts && r.parts.judgment === "present");
  for (const r of el) {
    const o = document.createElement("option");
    o.value = r.issue_id + "/" + r.run_id;
    o.textContent = `${r.issue_id} / ${r.run_id}`;
    sel.appendChild(o);
  }
  sel.onchange = () => load(sel.value);
  if (el.length) load(sel.value);
}

async function load(key) {
  const [issue, run] = key.split("/");
  const d = await (await fetch(`/api/ledger/${issue}/${run}`)).json();
  const m = document.getElementById("main");
  let html = `<div class="banner">ledger_mode=${d.ledger_mode} — ${d.note}</div>`;

  if (d.injections.length) {
    html += `<h2 style="font-size:14px">재주입 사건 ${d.injections.length}건</h2>`;
    for (const inj of d.injections) {
      html += `<div class="stage inj"><h2>라운드 ${inj.round} 재주입 (${inj.reason})</h2>
        <div>` + inj.injected.map(f =>
          `<span class="chip ${inj.outcome.revived.includes(f.fact_id) ? "ok" : ""}">`
          + (f.critical ? "★ " : "") + f.fact_id
          + (inj.outcome.revived.includes(f.fact_id) ? " → 생환" : " → 여전히 소실") + `</span>`).join("")
        + `</div><details><summary class="meta">재조립 블록 문구 (실삽입 원문 아님 — v0.3 안건)</summary>
        <pre class="block">${inj.block_text_rebuilt}</pre></details></div>`;
    }
  }

  html += `<h2 style="font-size:14px">라운드별 소실 장부</h2>`;
  for (const s of d.ledger_by_stage) {
    html += `<div class="stage"><h2>stage ${s.stage} — 소실 ${s.n_missing}종
      <span class="meta">(v0 재주입 블록 크기 ${s.would_inject_chars}자)</span></h2>
      <div>` + (s.missing.length
        ? s.missing.map(f => `<span class="chip">${f.critical ? "★ " : ""}${f.fact_id}</span>`).join("")
          + `<div class="meta" style="margin-top:4px">`
          + s.missing.map(f => `${f.fact_id}: ${f.text}…`).join("<br>") + `</div>`
        : `<span class="chip ok">소실 없음</span>`)
      + `</div></div>`;
  }
  m.innerHTML = html;
}
loadRuns();
</script>
</body>
</html>
