<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>장부 — 사라진 팩트를 다시 넣은 기록</title>
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a333d; --fg:#dbe4ec; --dim:#8598a8;
          --ok:#3fb97f; --dead:#e06565; --inject:#e0a53f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,'Malgun Gothic',sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  nav a { color:var(--dim); margin-right:10px; text-decoration:none; font-size:13px; }
  nav a.here { color:var(--fg); }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           padding:4px 8px; border-radius:4px; }
  main { padding:16px 20px; max-width:1000px; }
  .banner { background:var(--panel); border:1px solid var(--inject); border-radius:6px;
            padding:8px 12px; margin-bottom:14px; color:var(--inject); font-size:13px; }
  .stage { background:var(--panel); border:1px solid var(--line); border-radius:6px;
           padding:10px 14px; margin-bottom:12px; }
  .stage h2 { margin:0 0 6px; font-size:14px; }
  .chip { display:inline-block; border:1px solid var(--dead); color:var(--dead);
          border-radius:8px; padding:1px 8px; font-size:12px; margin:2px 4px 2px 0; }
  .chip.ok { border-color:var(--ok); color:var(--ok); }
  .meta { color:var(--dim); font-size:12px; }
  pre.block { background:#0c1013; border:1px solid var(--line); border-radius:6px;
              padding:10px; white-space:pre-wrap; font-size:12.5px; color:#c9d6e2; }
  .inj { border-color:var(--inject); }
  /* 입력 전문 */
  .pick { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0 10px; }
  .pick select { background:#0c1013; color:var(--fg); border:1px solid var(--line);
                 padding:3px 7px; border-radius:4px; font-size:12.5px; }
  pre.full { background:#0c1013; border:1px solid var(--line); border-radius:6px;
             padding:12px 14px; white-space:pre-wrap; font-size:12.5px; color:#c9d6e2;
             max-height:460px; overflow:auto; }
  pre.full mark { background:#3a2c12; color:var(--inject); border-radius:3px; padding:0 2px; }
  .said { border-left:3px solid var(--ok); padding:8px 10px; margin-top:8px;
          background:#141b16; white-space:pre-wrap; font-size:12.5px; }
  .parts { font-size:12px; color:var(--dim); margin-bottom:8px; line-height:1.7; }
  .parts b { color:var(--fg); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>장부 <span style="color:var(--inject);font-size:12px">— 라운드마다 사라진 팩트 목록 · 다시 넣은 결과</span></h1>
  <nav id="nav"></nav>
  <select id="runsel"><option>실행 목록 불러오는 중…</option></select>
</header>
<main id="main"><p class="meta">불러오는 중…</p></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let IN = null, PICK = null;      // 입력 전문 데이터와 고른 (라운드, 참가자)

async function loadRuns() {
  document.getElementById("nav").innerHTML = `<a href="/biography">전기</a><a class="here" href="/ledger">장부</a><a href="/transmission">레이더</a><a href="/audit">대조</a>`;
  const data = await (await fetch("/api/runs")).json();
  const sel = document.getElementById("runsel"); sel.innerHTML = "";
  const el = data.runs.filter(r => r.parts && r.parts.judgment === "present");
  for (const r of el) {
    const o = document.createElement("option");
    o.value = r.issue_id + "/" + r.run_id;
    o.textContent = `${r.issue_id} / ${r.run_id}`;
    sel.appendChild(o);
  }
  sel.onchange = () => load(sel.value);
  if (el.length) load(sel.value);
}

/* 입력 전문 — 장부가 넣은 문구가 실제로 누구 입력에 어떻게 들어갔는지 사람이 읽는 자리.
   재조립은 서버(validate.reassemble_prompt)가 하고 화면은 렌더만 한다. */
function inputsSection() {
  if (!IN) return "";
  let h = `<h2 style="font-size:14px">입력 전문 <span class="meta">— 말하기 전에 무엇을 봤나</span></h2>`;
  if (IN.status !== "ok")
    return h + `<div class="banner">입력 기록 없음 — ${esc(IN.note)}</div>`;

  const items = IN.items;
  if (!PICK) {                                    // 처음엔 재주입이 든 입력으로 — 장부 화면의 관심사
    const first = items.find(i => i.inject_text) || items[0];
    PICK = [first.round, first.agent_id];
  }
  const cur = items.find(i => i.round === PICK[0] && i.agent_id === PICK[1]) || items[0];

  h += `<div class="meta">${esc(IN.note)}</div>`;
  h += `<div class="pick">
    <label class="meta">라운드</label>
    <select onchange="pickRound(this.value)">` +
    IN.rounds.map(r => `<option value="${r}"${r === cur.round ? " selected" : ""}>라운드 ${r}</option>`).join("") +
    `</select>
    <label class="meta">참가자</label>
    <select onchange="pickAgent(this.value)">` +
    items.filter(i => i.round === cur.round).map(i =>
      `<option value="${esc(i.agent_id)}"${i.agent_id === cur.agent_id ? " selected" : ""}>${esc(i.agent_id)}${i.inject_text ? " · 장부 문구 들어감" : ""}</option>`).join("") +
    `</select>
    <span class="chip ${cur.hash_match ? "ok" : ""}">${cur.hash_match ? "지문 대조 확인" : "지문 확인 실패"}</span>
    <span class="meta">${items.length}건 중 ${IN.n_verified}건 확인${IN.n_mismatch ? ` · 불일치 ${IN.n_mismatch}` : ""}</span>
  </div>`;

  if (cur.error) return h + `<div class="banner">이 입력은 되살릴 수 없었습니다 — ${esc(cur.error)}</div>`;

  const s = cur.slots;
  h += `<div class="parts">이 입력은 이렇게 조립됐습니다 —
    ${s.assigned_facts.length ? `<b>배정 팩트 ${s.assigned_facts.length}개</b>(${s.assigned_facts.map(f => esc(f.fact_id.replace(/^fact_/, ""))).join(", ")}) · ` : ""}
    ${s.previous ? `<b>자기 직전 발화</b>(라운드 ${s.previous.round}) · ` : ""}
    ${s.others.length ? `<b>이웃 발화 ${s.others.length}건</b>(${s.others.map(o => esc(o.agent_id) + " 라운드 " + o.round).join(", ")}) · ` : ""}
    ${cur.inject_text ? `<b style="color:var(--inject)">장부가 다시 넣은 문구</b>(팩트 ${cur.inject_fact_ids.length}개 — 아래 노란 부분)` : "장부 문구 없음"}
    <br>사용한 틀: ${esc(cur.template)} · ${esc(cur.prompt_ver || "")}</div>`;

  // 재주입 블록은 입력 안에서 눈에 보이게 표시한다 — "장부가 넣은 자리"가 이 화면의 요점.
  let body = esc(cur.text);
  if (cur.inject_text) {
    const mark = esc(cur.inject_text);
    if (body.includes(mark)) body = body.replace(mark, `<mark>${mark}</mark>`);
  }
  h += `<pre class="full">${body}</pre>`;
  h += `<div class="meta" style="margin-top:8px">이 입력을 받고 한 말 —</div>
        <div class="said">${esc(cur.response_text || "(발화 원문 없음)")}</div>`;
  return h;
}

function pickRound(r) {
  const rd = Number(r);
  const first = IN.items.find(i => i.round === rd);
  PICK = [rd, first.agent_id]; render();
}
function pickAgent(a) { PICK = [PICK[0], a]; render(); }

let LEDGER = null;
function render() { document.getElementById("main").innerHTML = LEDGER + inputsSection(); }

async function load(key) {
  const [issue, run] = key.split("/");
  const d = await (await fetch(`/api/ledger/${issue}/${run}`)).json();
  IN = await (await fetch(`/api/inputs/${issue}/${run}`)).json();
  PICK = null;
  const modeKey = d.ledger_mode === "off" ? "ledger_off" : d.ledger_mode === "v0" ? "ledger_v0" : null;

  let html = "";
  html += `<div class="banner">${esc(String(d.ledger_mode === "off" ? "ledger_mode=off" : d.ledger_mode === "v0" ? "ledger_mode=v0" : d.ledger_mode))} — ${d.note}</div>`;

  if (d.injections.length) {
    html += `<h2 style="font-size:14px">재주입 ${d.injections.length}건</h2>`;
    for (const inj of d.injections) {
      html += `<div class="stage inj"><h2>라운드 ${inj.round}에 다시 넣음 (${inj.reason})</h2>
        <div>` + inj.injected.map(f =>
          `<span class="chip ${inj.outcome.revived.includes(f.fact_id) ? "ok" : ""}">`
          + (f.critical ? "★ " : "") + f.fact_id
          + (inj.outcome.revived.includes(f.fact_id) ? " → 다시 언급됨" : " → 그래도 안 나옴") + `</span>`).join("")
        + `</div><details><summary class="meta">${inj.block_text_source === "injected_text"
             ? "실제로 넣은 문구 원문 (로그에 그대로 남아 있음)"
             : "넣었을 문구를 되짚어 만든 것 (이 로그에는 실제 문구가 없음 — 옛 판본 산출물)"}</summary>
        <pre class="block">${inj.block_text}</pre></details></div>`;
    }
  }

  html += `<h2 style="font-size:14px">라운드별 사라진 팩트 목록</h2>`;
  for (const s of d.ledger_by_stage) {
    html += `<div class="stage"><h2>라운드 ${s.stage} — 사라짐 ${s.n_missing}개
      <span class="meta">(다시 넣는다면 들어갈 문구 ${s.would_inject_chars}자)</span></h2>
      <div>` + (s.missing.length
        ? s.missing.map(f => `<span class="chip">${f.critical ? "★ " : ""}${f.fact_id}</span>`).join("")
          + `<div class="meta" style="margin-top:4px">`
          + s.missing.map(f => `${f.fact_id}: ${f.text}…`).join("<br>") + `</div>`
        : `<span class="chip ok">사라진 팩트 없음</span>`)
      + `</div></div>`;
  }
  LEDGER = html;
  render();
}
loadRuns();
</script>
</body>
</html>
