<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대조 — 판정 ↔ 원문</title>
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a333d; --fg:#dbe4ec; --dim:#8598a8;
          --ok:#3fb97f; --dead:#e06565; --inject:#e0a53f; --flag:#c77dff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,'Malgun Gothic',sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  nav a { color:var(--dim); margin-right:10px; text-decoration:none; font-size:13px; }
  nav a.here { color:var(--fg); }
  select, label { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           padding:4px 8px; border-radius:4px; font-size:13px; }
  label { border:none; background:none; color:var(--dim); }
  main { padding:16px 20px; max-width:1100px; }
  .banner { background:var(--panel); border:1px solid var(--inject); border-radius:6px;
            padding:8px 12px; margin-bottom:14px; color:var(--inject); font-size:13px; }
  .meta { color:var(--dim); font-size:12px; }
  h2 { font-size:14px; margin:18px 0 8px; }
  table.grid { border-collapse:collapse; font-size:12.5px; margin-bottom:8px; }
  table.grid td, table.grid th { border:1px solid var(--line); padding:3px 7px; text-align:center; }
  table.grid th { color:var(--dim); font-weight:normal; }
  table.grid td.fact { text-align:left; max-width:330px; color:var(--fg); }
  table.grid td.cell { cursor:pointer; min-width:52px; }
  table.grid td.cell:hover { outline:1px solid var(--fg); }
  td.cell.alive { color:var(--ok); }
  td.cell.dead  { color:var(--dead); }
  td.cell.flag  { background:#2a1f36; }
  td.cell.sel   { outline:2px solid var(--flag); }
  .fid { color:var(--dim); margin-right:5px; }
  .star { color:var(--inject); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px;
           padding:12px 14px; margin-bottom:12px; }
  .chip { display:inline-block; border:1px solid var(--line); color:var(--dim);
          border-radius:8px; padding:1px 8px; font-size:12px; margin:2px 4px 2px 0; }
  .chip.ok { border-color:var(--ok); color:var(--ok); }
  .chip.dead { border-color:var(--dead); color:var(--dead); }
  .chip.flag { border-color:var(--flag); color:var(--flag); }
  .utt { border:1px solid var(--line); border-left:3px solid var(--line);
         border-radius:4px; padding:8px 10px; margin:8px 0; white-space:pre-wrap;
         font-size:13px; color:#c9d6e2; }
  .utt.counted { border-left-color:var(--ok); }
  .utt.suspect { border-left-color:var(--flag); background:#1e1a26; }
  .who { color:var(--dim); font-size:12px; margin-bottom:4px; }
  .prox { float:right; color:var(--dim); font-size:12px; }
  .facttext { background:#0c1013; border:1px solid var(--line); border-radius:6px;
              padding:9px 12px; margin-bottom:10px; font-size:13.5px; }
</style>
</head>
<body>
<header>
  <h1>대조 <span style="color:var(--flag);font-size:12px">— 판정 셀 옆에 그 라운드 발화 전문</span></h1>
  <nav><a href="/biography">전기</a><a href="/ledger">장부</a><a href="/transmission">레이더</a><a class="here" href="/audit">대조</a></nav>
  <select id="runsel"><option>run 로딩…</option></select>
  <label><input type="checkbox" id="onlyflag"> 볼 값어치 있는 셀만</label>
</header>
<main id="main"><p class="meta">로딩…</p></main>
<script>
let D = null, SEL = null;
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const FLAGNAME = {
  uncounted_high: "계상 안 됐는데 원문이 남은 발화 있음",
  partial_count:  "센 명단에서 빠진 화자 있음",
  split:          "표 갈림",
  gray:           "H2 전이 구간 (검출이 갈리는 근접도)",
};

async function loadRuns() {
  const data = await (await fetch("/api/runs")).json();
  const sel = document.getElementById("runsel"); sel.innerHTML = "";
  const el = (data.runs || []).filter(r => r.parts && r.parts.judgment === "present");
  for (const r of el) {
    const o = document.createElement("option");
    o.value = r.issue_id + "/" + r.run_id;
    o.textContent = `${r.issue_id} / ${r.run_id}`;
    sel.appendChild(o);
  }
  sel.onchange = () => load(sel.value);
  document.getElementById("onlyflag").onchange = render;
  if (el.length) load(sel.value); else
    document.getElementById("main").innerHTML = `<p class="meta">판정된 run이 없습니다 — 대조는 judgment 이후입니다.</p>`;
}

async function load(key) {
  const [issue, run] = key.split("/");
  D = await (await fetch(`/api/audit/${issue}/${run}`)).json();
  SEL = null;
  for (const f of D.facts) {                     // 처음엔 볼 값어치 있는 첫 셀로
    const c = f.cells.find(c => c.flags.length);
    if (c) { SEL = [f.fact_id, c.stage]; break; }
  }
  render();
}

function render() {
  const only = document.getElementById("onlyflag").checked;
  const facts = only ? D.facts.filter(f => f.cells.some(c => c.flags.length)) : D.facts;

  let h = `<div class="banner">${esc(D.note)}</div>`;
  h += `<div class="meta">judge ${esc((D.judge||{}).model || "?")} · 팩트 ${D.facts.length} ·
        라운드 ${D.stages.length} · <b style="color:var(--flag)">볼 값어치 있는 셀 ${D.n_flagged_cells}</b>
        · 근접도 구간별 판정기 검출률(H2): ${D.bands.map(b => `≥${b.min} → ${b.detect}`).join(" · ")}</div>`;

  h += `<h2>어디를 볼 것인가 <span class="meta">— 셀을 누르면 아래에 그 라운드 발화 전문이 열립니다</span></h2>`;
  h += `<table class="grid"><tr><th>팩트</th>` +
       D.stages.map(s => `<th>r${s}</th>`).join("") + `</tr>`;
  for (const f of facts) {
    h += `<tr><td class="fact"><span class="fid">${esc(f.fact_id.replace(/^fact_/, ""))}</span>` +
         (f.critical ? `<span class="star">★</span> ` : "") + esc(f.text.slice(0, 44)) +
         (f.text.length > 44 ? "…" : "") + `</td>`;
    for (const s of D.stages) {
      const c = f.cells.find(c => c.stage === s);
      if (!c) { h += `<td class="meta">·</td>`; continue; }
      const on = SEL && SEL[0] === f.fact_id && SEL[1] === s;
      h += `<td class="cell ${c.surviving ? "alive" : "dead"}${c.flags.length ? " flag" : ""}${on ? " sel" : ""}"
            title="${esc(c.status)} · 근접도 ${c.max_prox}${c.flags.length ? " · " + c.flags.map(x => FLAGNAME[x]).join(" / ") : ""}"
            onclick="pick('${f.fact_id}',${s})">${c.surviving ? "●" : "○"}${c.flags.length ? "<span style='color:var(--flag)'>*</span>" : ""}</td>`;
    }
    h += `</tr>`;
  }
  h += `</table><div class="meta">● 생존 · ○ 소실 · <span style="color:var(--flag)">*</span> 원문을 눈으로 볼 값어치가 있는 셀</div>`;
  h += detail();
  document.getElementById("main").innerHTML = h;
}

function detail() {
  if (!SEL) return `<h2>대조</h2><p class="meta">셀을 고르세요. (표시할 셀이 없으면 이 run에서는 눈에 걸리는 것이 없다는 뜻입니다.)</p>`;
  const f = D.facts.find(x => x.fact_id === SEL[0]);
  const c = f.cells.find(x => x.stage === SEL[1]);
  const us = D.utterances[String(c.stage)] || [];

  let h = `<h2>대조 — ${esc(f.fact_id)} · 라운드 ${c.stage}</h2>`;
  h += `<div class="facttext"><span class="meta">팩트 원문</span><br>${f.critical ? "<span class='star'>★</span> " : ""}${esc(f.text)}</div>`;
  h += `<div class="panel"><div>
        <span class="chip ${c.surviving ? "ok" : "dead"}">판정: ${esc(c.status)}</span>
        <span class="chip">표 ${esc(c.votes.split || "-")}${c.votes.unanimous === false ? " (갈림)" : ""}</span>
        <span class="chip">센 화자: ${c.counted.length ? c.counted.map(esc).join(", ") : "없음"}</span>
        ${c.votes.parse_fail ? `<span class="chip dead">파싱실패 ${c.votes.parse_fail}</span>` : ""}
        ${c.flags.map(x => `<span class="chip flag">${FLAGNAME[x]}</span>`).join("")}
        </div>`;
  if (c.flags.includes("uncounted_high"))
    h += `<div class="meta" style="margin-top:6px">판정은 이 팩트를 <b>소실</b>로 셌는데,
          같은 라운드에 근접도 ${c.max_prox}(${esc(c.max_prox_agent)})인 발화가 있습니다. 아래 원문을 읽고 판단하세요.</div>`;
  if (c.flags.includes("partial_count"))
    h += `<div class="meta" style="margin-top:6px">살아 있다고 셌지만, 근접도가 높은데 센 명단에서 빠진 화자가 있습니다:
          <b>${c.missed_high.map(esc).join(", ")}</b>. 같은 라운드 안 화자 간 누락입니다.</div>`;
  h += `</div>`;

  h += `<div class="meta">이 라운드 발화 ${us.length}건 — <b>전문 그대로</b>. 판정기가 센 것(초록)과
        안 센 것을 가르지 않고 전부 싣습니다.</div>`;
  for (const u of us) {
    const p = c.prox[u.agent_id] ?? 0;
    const counted = c.counted.includes(u.agent_id);
    const suspect = !counted && p >= 0.4;
    h += `<div class="utt ${counted ? "counted" : ""}${suspect ? " suspect" : ""}">
          <div class="who">${esc(u.agent_id)}${u.perspective ? " · " + esc(u.perspective) : ""}
          ${counted ? `<span class="chip ok">센 발화</span>` : `<span class="chip">안 셈</span>`}
          <span class="prox">근접도 ${p}</span></div>${esc(u.text) || "<span class='meta'>(빈 발화)</span>"}</div>`;
  }
  return h;
}

function pick(fid, stage) { SEL = [fid, stage]; render(); window.scrollTo({top: document.body.scrollHeight * 0.35, behavior: "smooth"}); }
loadRuns();
</script>
</body>
</html>
