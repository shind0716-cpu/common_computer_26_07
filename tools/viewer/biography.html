<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>전기 — 팩트 하나가 라운드마다 겪은 일</title>
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a333d; --fg:#dbe4ec; --dim:#8598a8;
          --ok:#3fb97f; --dead:#e06565; --inject:#e0a53f; --ledger:#7fb0e0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,'Malgun Gothic',sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  header .proto { color:var(--inject); font-size:12px; }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           padding:4px 8px; border-radius:4px; }
  main { display:flex; min-height:calc(100vh - 90px); }
  #sidebar { width:330px; border-right:1px solid var(--line); overflow-y:auto;
             display:flex; flex-direction:column; }
  #conditions { padding:10px 12px; border-bottom:1px solid var(--line);
                background:var(--panel); font-size:12px; }
  #conditions h2 { margin:0 0 6px; font-size:12px; color:var(--dim);
                   text-transform:none; letter-spacing:.5px; }
  #conditions table { width:100%; border-collapse:collapse; }
  #conditions td { padding:1px 0; vertical-align:top; }
  #conditions td:first-child { color:var(--dim); width:78px; }
  #pfilter { margin-top:8px; width:100%; }
  #factlist { flex:1; overflow-y:auto; }
  .persp { display:inline-block; background:#20303e; border:1px solid #33485a;
           border-radius:8px; padding:0 7px; font-size:11px; margin:2px 3px 0 0;
           color:#9ec4e0; }
  .factrow { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .factrow:hover, .factrow.sel { background:var(--panel); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .rowmeta { color:var(--dim); font-size:12px; margin-top:2px; }
  #detail { flex:1; padding:16px 20px; overflow-y:auto; }
  .facthead { border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:14px; }
  .tag { display:inline-block; background:var(--panel); border:1px solid var(--line);
         border-radius:3px; padding:1px 7px; font-size:12px; margin-right:5px; color:var(--dim); }
  .chain { display:flex; flex-direction:column; gap:0; }
  .stagecard { display:flex; gap:14px; padding:10px 0; }
  .rail { display:flex; flex-direction:column; align-items:center; width:26px; }
  .node { width:14px; height:14px; border-radius:50%; border:2px solid var(--dim); }
  .node.ok { background:var(--ok); border-color:var(--ok); }
  .node.dead { background:var(--dead); border-color:var(--dead); }
  .node.split { background:repeating-linear-gradient(45deg,var(--ok),var(--ok) 3px,#20262d 3px,#20262d 6px); }
  .railline { flex:1; width:2px; background:var(--line); }
  .card { flex:1; background:var(--panel); border:1px solid var(--line);
          border-radius:6px; padding:8px 12px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
  .badge { font-size:11px; padding:1px 7px; border-radius:8px; border:1px solid var(--line); }
  .b-ok { color:var(--ok); border-color:var(--ok); }
  .b-dead { color:var(--dead); border-color:var(--dead); }
  .b-inj { color:var(--inject); border-color:var(--inject); }
  .b-led { color:var(--ledger); border-color:var(--ledger); }
  .b-warn { color:#e0d05f; border-color:#e0d05f; }
  .snips { margin:6px 0 0; padding:0; list-style:none; }
  .snips li { color:var(--dim); font-size:12px; margin-top:4px; border-left:2px solid var(--line);
              padding-left:8px; }
  .snips b { color:var(--fg); }
  footer { padding:8px 16px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>전기 <span class="proto">— 팩트 하나가 라운드마다 겪은 일 (읽기 전용)</span></h1>
  <nav id="nav" style="font-size:13px"></nav>
  <select id="runsel"><option>실행 목록 불러오는 중…</option></select>
  <span id="runinfo" class="proto"></span>
</header>
<main>
  <div id="sidebar">
    <div id="conditions"></div>
    <div id="factlist"></div>
  </div>
  <div id="detail"><p style="color:var(--dim)">왼쪽에서 팩트를 하나 고르세요.</p></div>
</main>
<footer id="note"></footer>
<script>
// 사건 이름표 — 이 화면의 세로 줄은 상태가 아니라 "그 라운드에 무슨 일이 있었나"다.
const EV_LABEL = {
  first_mention: ["처음 말해짐","b-ok"], alive: ["계속 살아 있음","b-ok"],
  died: ["여기서 사라짐","b-dead"], missing: ["계속 안 나옴","b-dead"],
  revived_ledger: ["다시 넣어줘서 되살아남","b-led"], revived_organic: ["저절로 되살아남","b-ok"],
};

let BIO = null;

async function loadRuns() {
  // 순서 = 관측 흐름(넓게→좁게).
  document.getElementById("nav").innerHTML = `<a href="/">두 판</a><a href="/audit">대조</a><a class="here" href="/biography">전기</a>`;
  const res = await fetch("/api/runs"); const data = await res.json();
  const sel = document.getElementById("runsel"); sel.innerHTML = "";
  const eligible = data.runs.filter(r => r.parts && r.parts.judgment === "present");
  if (!eligible.length) { sel.innerHTML = "<option>채점까지 끝난 실행 없음</option>"; return; }
  for (const r of eligible) {
    const o = document.createElement("option");
    o.value = r.issue_id + "/" + r.run_id;
    o.textContent = `${r.issue_id} / ${r.run_id}`
      + (r.far_system != null ? ` — 사라진 팩트 ${Math.round(r.far_system * 100)}%` : "");
    sel.appendChild(o);
  }
  sel.onchange = () => loadBio(sel.value);
  loadBio(sel.value);
}

async function loadBio(key) {
  const [issue, run] = key.split("/");
  const res = await fetch(`/api/biography/${issue}/${run}`);
  BIO = await res.json();
  document.getElementById("runinfo").innerHTML =
    (BIO.ledger_mode === "off" ? "ledger_mode=off" : BIO.ledger_mode === "v0" ? "ledger_mode=v0"
      : `장부 ${BIO.ledger_mode}`) + ` · 라운드 ${BIO.stages.length}바퀴`;
  document.getElementById("note").textContent = BIO.note;
  renderConditions();
  renderList("");
}

function renderConditions() {
  const c = BIO.conditions || {};
  const j = c.judge || {};
  const el = document.getElementById("conditions");
  el.innerHTML = `<h2>이 판의 조건</h2><table>
    <tr><td>seed</td><td>${c.seed ?? "—"}</td></tr>
    <tr><td>에이전트</td><td>${c.n_agents ?? "—"}명 · 라운드 ${c.n_rounds ?? "—"}바퀴</td></tr>
    <tr><td>ledger</td><td>${c.ledger_mode ?? "—"}</td></tr>
    <tr><td>judge</td><td>${j.model ?? "—"} · ${j.n_votes ?? "?"}번 채점 후 다수결 ${j.prompt_ver ?? ""}</td></tr>
    <tr><td>FAR</td><td>${c.far_system ?? "—"}</td></tr>
  </table>
  <select id="pfilter"><option value="">관점 전체</option>`
    + (c.perspectives || []).map(p => `<option value="${p}">${p}</option>`).join("")
    + `</select>`;
  document.getElementById("pfilter").onchange = e => renderList(e.target.value);
}

function renderList(persp) {
  const list = document.getElementById("factlist"); list.innerHTML = "";
  const facts = BIO.facts.filter(f => !persp || f.perspectives.includes(persp));
  facts.forEach(f => {
    const i = BIO.facts.indexOf(f);
    const d = document.createElement("div");
    d.className = "factrow"; d.dataset.idx = i;
    const col = f.summary.final_surviving ? "var(--ok)" : "var(--dead)";
    const rev = (f.summary.n_revived_ledger ? ` · 다시 넣어서 되살아남 ${f.summary.n_revived_ledger}번` : "")
              + (f.summary.n_revived_organic ? ` · 저절로 되살아남 ${f.summary.n_revived_organic}번` : "");
    d.innerHTML = `<span class="dot" style="background:${col}"></span>`
      + (f.critical ? "★ " : "") + f.fact_id
      + `<div class="rowmeta">${f.text.slice(0, 46)}…<br>`
      + (f.summary.first_missing_stage != null
          ? `라운드 ${f.summary.first_missing_stage}에서 처음 사라짐` : "한 번도 안 사라짐")
      + rev + `<br>` + f.perspectives.map(p => `<span class="persp">${p}</span>`).join("")
      + `</div>`;
    d.onclick = () => { document.querySelectorAll(".factrow").forEach(x => x.classList.remove("sel"));
                        d.classList.add("sel"); renderFact(i); };
    list.appendChild(d);
  });
  if (facts.length) { list.firstChild.classList.add("sel"); renderFact(BIO.facts.indexOf(facts[0])); }
  else { document.getElementById("detail").innerHTML =
         `<p style="color:var(--dim)">이 관점에 배정된 팩트 없음.</p>`; }
}

function renderFact(i) {
  const f = BIO.facts[i]; const el = document.getElementById("detail");
  let html = `<div class="facthead"><b>${f.critical ? "★ " : ""}${f.fact_id}</b> — ${f.text}
    <div style="margin-top:6px">` + f.tags.map(tg => `<span class="tag">${tg}</span>`).join("")
    + `<span class="tag">처음 이 팩트를 받은 사람: ${f.assigned_to.join(", ") || "?"}</span>`
    + f.perspectives.map(p => `<span class="persp">${p}</span>`).join("")
    + `</div></div><div class="chain">`;
  f.chain.forEach((c, k) => {
    const nodeCls = !c.surviving ? "dead" : (c.votes.unanimous === false ? "split" : "ok");
    const [lab, cls] = EV_LABEL[c.event] || [c.event, ""];
    html += `<div class="stagecard"><div class="rail"><div class="node ${nodeCls}"></div>`
      + (k < f.chain.length - 1 ? `<div class="railline"></div>` : "") + `</div><div class="card">
      <div class="badges"><span class="badge">라운드 ${c.stage}</span>
      <span class="badge ${c.surviving ? "b-ok" : "b-dead"}">${c.status}</span>
      <span class="badge ${cls}">${lab}</span>`
      + (c.injected ? `<span class="badge b-inj">이 라운드에 다시 넣어줌</span>` : "")
      + (c.votes.n ? `<span class="badge ${c.votes.unanimous === false ? "b-warn" : ""}">표 ${c.votes.split}${c.votes.unanimous === false ? " 표 갈림" : ""}</span>` : "")
      + (c.votes.parse_fail ? `<span class="badge b-warn">parse_fail ${c.votes.parse_fail}</span>` : "")
      + `</div>`;
    if (c.mentions.length) {
      html += `<ul class="snips">` + c.mentions.map(m =>
        `<li><b>${m.agent_id}</b>: ${m.snippet ? m.snippet + "…" : "(발화 원문 없음)"}</li>`).join("") + `</ul>`;
    }
    html += `</div></div>`;
  });
  el.innerHTML = html + `</div>`;
}
loadRuns();
</script>
</body>
</html>
