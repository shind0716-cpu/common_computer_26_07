<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팩트 전기 — 프로토타입</title>
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a333d; --fg:#dbe4ec; --dim:#8598a8;
          --ok:#3fb97f; --dead:#e06565; --inject:#e0a53f; --ledger:#7fb0e0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,'Malgun Gothic',sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  header .proto { color:var(--inject); font-size:12px; }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           padding:4px 8px; border-radius:4px; }
  main { display:flex; min-height:calc(100vh - 90px); }
  #factlist { width:330px; border-right:1px solid var(--line); overflow-y:auto; }
  .factrow { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .factrow:hover, .factrow.sel { background:var(--panel); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .rowmeta { color:var(--dim); font-size:12px; margin-top:2px; }
  #detail { flex:1; padding:16px 20px; overflow-y:auto; }
  .facthead { border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:14px; }
  .tag { display:inline-block; background:var(--panel); border:1px solid var(--line);
         border-radius:3px; padding:1px 7px; font-size:12px; margin-right:5px; color:var(--dim); }
  .chain { display:flex; flex-direction:column; gap:0; }
  .stagecard { display:flex; gap:14px; padding:10px 0; }
  .rail { display:flex; flex-direction:column; align-items:center; width:26px; }
  .node { width:14px; height:14px; border-radius:50%; border:2px solid var(--dim); }
  .node.ok { background:var(--ok); border-color:var(--ok); }
  .node.dead { background:var(--dead); border-color:var(--dead); }
  .node.split { background:repeating-linear-gradient(45deg,var(--ok),var(--ok) 3px,#20262d 3px,#20262d 6px); }
  .railline { flex:1; width:2px; background:var(--line); }
  .card { flex:1; background:var(--panel); border:1px solid var(--line);
          border-radius:6px; padding:8px 12px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
  .badge { font-size:11px; padding:1px 7px; border-radius:8px; border:1px solid var(--line); }
  .b-ok { color:var(--ok); border-color:var(--ok); }
  .b-dead { color:var(--dead); border-color:var(--dead); }
  .b-inj { color:var(--inject); border-color:var(--inject); }
  .b-led { color:var(--ledger); border-color:var(--ledger); }
  .b-warn { color:#e0d05f; border-color:#e0d05f; }
  .snips { margin:6px 0 0; padding:0; list-style:none; }
  .snips li { color:var(--dim); font-size:12px; margin-top:4px; border-left:2px solid var(--line);
              padding-left:8px; }
  .snips b { color:var(--fg); }
  footer { padding:8px 16px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>팩트 전기 <span class="proto">— 프로토타입 (읽기 전용 · 상태가 아니라 사건)</span></h1>
  <select id="runsel"><option>run 로딩…</option></select>
  <span id="runinfo" class="proto"></span>
</header>
<main>
  <div id="factlist"></div>
  <div id="detail"><p style="color:var(--dim)">run과 팩트를 선택하세요.</p></div>
</main>
<footer id="note"></footer>
<script>
const EV_LABEL = {
  first_mention: ["첫 언급","b-ok"], alive: ["생존 지속","b-ok"],
  died: ["사망","b-dead"], missing: ["침묵","b-dead"],
  revived_ledger: ["부활 — 장부 경로","b-led"], revived_organic: ["부활 — 자생","b-ok"],
};
let BIO = null;

async function loadRuns() {
  const res = await fetch("/api/runs"); const data = await res.json();
  const sel = document.getElementById("runsel"); sel.innerHTML = "";
  const eligible = data.runs.filter(r => r.parts && r.parts.judgment === "present");
  if (!eligible.length) { sel.innerHTML = "<option>판정 완료 run 없음</option>"; return; }
  for (const r of eligible) {
    const o = document.createElement("option");
    o.value = r.issue_id + "/" + r.run_id;
    o.textContent = `${r.issue_id} / ${r.run_id}` + (r.far_system != null ? ` (FAR ${r.far_system})` : "");
    sel.appendChild(o);
  }
  sel.onchange = () => loadBio(sel.value);
  loadBio(sel.value);
}

async function loadBio(key) {
  const [issue, run] = key.split("/");
  const res = await fetch(`/api/biography/${issue}/${run}`);
  BIO = await res.json();
  document.getElementById("runinfo").textContent =
    `ledger_mode=${BIO.ledger_mode} · stage ${BIO.stages.length}개`;
  document.getElementById("note").textContent = BIO.note;
  const list = document.getElementById("factlist"); list.innerHTML = "";
  BIO.facts.forEach((f, i) => {
    const d = document.createElement("div");
    d.className = "factrow"; d.dataset.idx = i;
    const col = f.summary.final_surviving ? "var(--ok)" : "var(--dead)";
    const rev = (f.summary.n_revived_ledger ? ` · 장부부활 ${f.summary.n_revived_ledger}` : "")
              + (f.summary.n_revived_organic ? ` · 자생부활 ${f.summary.n_revived_organic}` : "");
    d.innerHTML = `<span class="dot" style="background:${col}"></span>`
      + (f.critical ? "★ " : "") + f.fact_id
      + `<div class="rowmeta">${f.text.slice(0, 46)}…<br>`
      + (f.summary.first_missing_stage != null ? `첫 소실 s${f.summary.first_missing_stage}` : "무소실")
      + rev + `</div>`;
    d.onclick = () => { document.querySelectorAll(".factrow").forEach(x => x.classList.remove("sel"));
                        d.classList.add("sel"); renderFact(i); };
    list.appendChild(d);
  });
  if (BIO.facts.length) { list.firstChild.classList.add("sel"); renderFact(0); }
}

function renderFact(i) {
  const f = BIO.facts[i]; const el = document.getElementById("detail");
  let html = `<div class="facthead"><b>${f.critical ? "★ " : ""}${f.fact_id}</b> — ${f.text}
    <div style="margin-top:6px">` + f.tags.map(t => `<span class="tag">${t}</span>`).join("")
    + `<span class="tag">배정: ${f.assigned_to.join(", ") || "?"}</span></div></div><div class="chain">`;
  f.chain.forEach((c, k) => {
    const nodeCls = !c.surviving ? "dead" : (c.votes.unanimous === false ? "split" : "ok");
    const [lab, cls] = EV_LABEL[c.event] || [c.event, ""];
    html += `<div class="stagecard"><div class="rail"><div class="node ${nodeCls}"></div>`
      + (k < f.chain.length - 1 ? `<div class="railline"></div>` : "") + `</div><div class="card">
      <div class="badges"><span class="badge">stage ${c.stage}</span>
      <span class="badge ${c.surviving ? "b-ok" : "b-dead"}">${c.status}</span>
      <span class="badge ${cls}">${lab}</span>`
      + (c.injected ? `<span class="badge b-inj">이 라운드에 재주입됨</span>` : "")
      + (c.votes.n ? `<span class="badge ${c.votes.unanimous === false ? "b-warn" : ""}">표 ${c.votes.split}${c.votes.unanimous === false ? " 분열" : ""}</span>` : "")
      + (c.votes.parse_fail ? `<span class="badge b-warn">parse_fail ${c.votes.parse_fail}</span>` : "")
      + `</div>`;
    if (c.mentions.length) {
      html += `<ul class="snips">` + c.mentions.map(m =>
        `<li><b>${m.agent_id}</b>: ${m.snippet ? m.snippet + "…" : "(발화 원문 없음)"}</li>`).join("") + `</ul>`;
    }
    html += `</div></div>`;
  });
  el.innerHTML = html + `</div>`;
}
loadRuns();
</script>
</body>
</html>
