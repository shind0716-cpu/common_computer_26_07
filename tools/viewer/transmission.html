<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>전달 레이더 — 프로토타입</title>
<style>
  :root { --bg:#101418; --panel:#1a2027; --line:#2a333d; --fg:#dbe4ec; --dim:#8598a8;
          --ok:#3fb97f; --dead:#e06565; --warn:#e0a53f; --led:#7fb0e0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,'Malgun Gothic',sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  nav a { color:var(--dim); margin-right:10px; text-decoration:none; font-size:13px; }
  nav a.here { color:var(--fg); }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line);
           padding:4px 8px; border-radius:4px; }
  main { padding:16px 20px; max-width:1100px; }
  .banner { background:var(--panel); border:1px solid var(--warn); border-radius:6px;
            padding:8px 12px; margin-bottom:12px; color:var(--warn); font-size:13px; }
  .cards { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px;
          padding:10px 14px; min-width:130px; }
  .card b { font-size:19px; display:block; }
  .card span { color:var(--dim); font-size:12px; }
  table { border-collapse:collapse; width:100%; font-size:13px; margin-bottom:16px; }
  th, td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  th { background:var(--panel); color:var(--dim); font-weight:600; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .excl { color:var(--dim); text-decoration:line-through; }
  .meta { color:var(--dim); font-size:12px; margin:4px 0 12px; }
  h2 { font-size:14px; margin:14px 0 6px; }
</style>
</head>
<body>
<header>
  <h1>전달 레이더 <span style="color:var(--warn);font-size:12px">— 프로토타입 (G2 층1 · 팀 제안 지위 · 탐색적)</span></h1>
  <nav><a href="/biography">전기</a><a href="/ledger">장부</a><a class="here" href="/transmission">레이더</a></nav>
  <select id="runsel"><option>run 로딩…</option></select>
</header>
<main id="main"><p class="meta">로딩…</p></main>
<script>
const F = v => v == null ? "—" : v;

async function loadRuns() {
  const data = await (await fetch("/api/runs")).json();
  const sel = document.getElementById("runsel"); sel.innerHTML = "";
  const el = data.runs.filter(r => r.parts && r.parts.judgment === "present");
  for (const r of el) {
    const o = document.createElement("option");
    o.value = r.issue_id + "/" + r.run_id;
    o.textContent = `${r.issue_id} / ${r.run_id}`;
    sel.appendChild(o);
  }
  sel.onchange = () => load(sel.value);
  if (el.length) load(sel.value);
}

async function load(key) {
  const [issue, run] = key.split("/");
  const res = await fetch(`/api/transmission/${issue}/${run}`);
  const m = document.getElementById("main");
  if (!res.ok) { m.innerHTML = `<p class="banner">${(await res.json()).detail}</p>`; return; }
  const d = await res.json();
  const s = d.system, lp = d.system_low_prior;

  let html = "";
  if (d.zero_point && d.zero_point.note)
    html += `<div class="banner">⚠ ${d.zero_point.note}</div>`;
  html += `<div class="meta">${d.status_note} · protocol=${d.protocol}</div>`;

  html += `<div class="cards">
    <div class="card"><b>${F(s.n_pairs_tracked)}</b><span>추적 쌍 (비보유자×팩트)</span></div>
    <div class="card"><b>${F(s.tsr_system)}</b><span>TSR 엄격 (u≥1)</span></div>
    <div class="card"><b>${F(s.tsr_system_upper)}</b><span>TSR 상한 (u=0 포함)</span></div>
    <div class="card"><b>${F(lp.tsr_system)}</b><span>low-prior TSR (추적자 정본)</span></div>
    <div class="card"><b>${F(s.kinds.acquisition)} / ${F(s.kinds.censored)}</b><span>획득 / 검열</span></div>
    <div class="card"><b>${F(s.kinds.prior_suspect)}</b><span>prior_suspect (차단)</span></div>
    <div class="card"><b>${F(s.by_channel.organic)}·${F(s.by_channel.ledger)}·${F(s.by_channel.mixed)}</b><span>채널: 자생·장부·혼합</span></div>
  </div>`;

  html += `<h2>팩트별 전달 폭</h2>
    <table><tr><th>팩트</th><th>prior</th><th>비보유자</th><th>노출</th><th>B (엄격)</th><th>B 상한</th><th>TSR</th></tr>`
    + d.fact_metrics.map(f => `<tr class="${f.excluded ? "excl" : ""}">
      <td>${f.critical ? "★ " : ""}${f.fact_id}${f.excluded ? " (영점 제외)" : ""}</td>
      <td>${F(f.prior_band)}</td><td class="num">${F(f.n_nonholders)}</td>
      <td class="num">${F(f.n_exposed)}</td><td class="num">${F(f.B)}</td>
      <td class="num">${F(f.B_upper)}</td><td class="num">${F(f.TSR)}</td></tr>`).join("")
    + `</table>`;

  const lt = (d.life_strict && d.life_strict.life_table) || [];
  if (lt.length) {
    html += `<h2>획득 생명표 (엄격 · 노출 후 경과 age)</h2>
      <table><tr><th>age</th><th>at risk</th><th>획득</th><th>검열</th><th>hazard</th></tr>`
      + lt.map(r => `<tr><td class="num">${r.age}</td><td class="num">${F(r.at_risk)}</td>
        <td class="num">${F(r.acquisitions)}</td><td class="num">${F(r.censored)}</td>
        <td class="num">${F(r.h_acq)}</td></tr>`).join("") + `</table>`;
  }
  html += `<div class="meta">원장(records) ${d.records.length}건 — 상세 감사는 API 직접 조회
    (/api/transmission/${issue}/${run}) · judgment_sha256=${d.audit.judgment_sha256.slice(0,12)}…</div>`;
  m.innerHTML = html;
}
loadRuns();
</script>
</body>
</html>
