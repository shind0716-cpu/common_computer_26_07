<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>레이더 — 말이 남에게 옮겨갔는지</title>
<style>
  /* 보고서 한 편 + 그림 1급 (민옥 전진 가설 보고서 양식 지향).
     색은 dataviz 참조 팔레트 light(종이면 #fcfcfb 기준 사전 검증분)만 사용:
     categorical 1~4 = #2a78d6 #eb6834 #1baf7a #eda100 (스택 인접 순서는 검증된 기본
     순서 1-2-3-4 그대로 — yellow 를 orange 옆에 두지 않는다). aqua·yellow 는 light
     대비 3:1 미만 → relief 규칙에 따라 직접 라벨 + 부록 표를 항상 병행한다. */
  :root { --chrome:#101418; --chrome-line:#2a333d; --chrome-fg:#8598a8;
          --paper:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
          --rule:#e1e0d9; --rule-strong:#c3c2b7;
          --c1:#2a78d6; --c1l:#9ec5f4; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--chrome);
         font:14px/1.65 system-ui,'Segoe UI','Malgun Gothic',sans-serif; }
  header { padding:9px 16px; border-bottom:1px solid var(--chrome-line);
           display:flex; gap:14px; align-items:center; color:var(--chrome-fg); }
  nav a { color:var(--chrome-fg); margin-right:10px; text-decoration:none; font-size:13px; }
  nav a.here { color:#dbe4ec; }
  select { background:#1a2027; color:#dbe4ec; border:1px solid var(--chrome-line);
           padding:4px 8px; border-radius:4px; }
  .sheet { max-width:820px; margin:26px auto 60px; background:var(--paper);
           color:var(--ink); padding:50px 60px 42px; border-radius:2px;
           box-shadow:0 2px 24px rgba(0,0,0,.5); }
  h1 { font-size:21px; margin:0 0 2px; letter-spacing:-.2px; }
  .subtitle { color:var(--ink-2); font-size:13px; margin-bottom:6px; }
  .statusline { color:var(--muted); font-size:12px; border-bottom:2px solid var(--ink);
                padding-bottom:14px; margin-bottom:20px; }
  h2 { font-size:14px; margin:26px 0 8px; padding-top:14px; border-top:1px solid var(--rule); }
  h2 .no { color:var(--muted); margin-right:8px; font-weight:600; }
  p.lead { font-size:14.5px; margin:8px 0; }
  sup { color:var(--c1); font-weight:600; }
  figure { margin:14px 0 6px; }
  figcaption { color:var(--ink-2); font-size:12.5px; margin-top:6px; }
  figcaption b { color:var(--ink); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2);
            margin-top:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px;
              margin-right:5px; vertical-align:-1px; }
  svg text { font:11.5px system-ui,'Segoe UI',sans-serif; fill:var(--ink-2); }
  svg text.val { fill:var(--ink); font-weight:600; }
  svg text.axis { fill:var(--muted); }
  details { margin:6px 0 2px; }
  summary { color:var(--muted); font-size:12px; cursor:pointer; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; margin:8px 0 4px; }
  th { text-align:left; color:var(--ink-2); font-weight:600;
       border-bottom:1px solid var(--rule-strong); padding:4px 8px 4px 0; }
  td { border-bottom:1px solid var(--rule); padding:3px 8px 3px 0; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.excl td { color:var(--muted); }
  tr.excl td:first-child { text-decoration:line-through; }
  .footnotes { margin-top:28px; border-top:1px solid var(--rule-strong); padding-top:10px;
               color:var(--ink-2); font-size:12px; }
  .footnotes p { margin:4px 0; }
  .audit { color:var(--muted); font-size:11.5px; margin-top:12px; }
  #tip { position:fixed; display:none; background:var(--ink); color:#fff; padding:4px 9px;
         border-radius:4px; font-size:12px; pointer-events:none; z-index:9; }
  @media print { header { display:none; } body { background:#fff; }
                 .sheet { box-shadow:none; margin:0; max-width:none; } }
</style>
</head>
<body>
<header>
  <nav id="nav"></nav>
  <select id="runsel"><option>실행 목록 불러오는 중…</option></select>
</header>
<div class="sheet" id="sheet"><p style="color:var(--muted)">불러오는 중…</p></div>
<div id="tip"></div>
<script>
const F = v => v == null ? "—" : v;
const PCT = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
// 그림 범례는 SVG·직접 라벨이라 일상어 한 낱말만 쓴다(병기는 본문·용어표에서 한다).
const KINDS = [["acquisition", "받아서 말함", "var(--c1)"],
               ["censored", "끝까지 모름", "var(--c2)"],
               ["never_exposed", "볼 기회 없음", "var(--c3)"],
               ["prior_suspect", "노출 전에 말함", "var(--c4)"]];

function tipOn(el) {
  el.addEventListener("mousemove", e => {
    const hit = e.target.closest("[data-tip]"); const tip = document.getElementById("tip");
    if (hit) { tip.textContent = hit.dataset.tip; tip.style.display = "block";
             tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px"; }
    else tip.style.display = "none";
  });
  el.addEventListener("mouseleave", () => document.getElementById("tip").style.display = "none");
}

/* 그림 1 — 추적 쌍 구성 분해: 수평 100% 스택 바 (세그먼트 2px 간격, 직접 라벨) */
function figKinds(s) {
  const total = s.n_pairs_tracked || 1;
  const parts = KINDS.map(([key, label, color]) => [key, label, color, s.kinds[key]]);
  const W = 660, H = 34; let x = 0, rects = "";
  for (const [key, label, color, v] of parts) {
    if (!v) continue;
    const w = Math.max(v / total * W - 2, 2);
    rects += `<g data-tip="${label} ${v}건 (${PCT(v / total)})">
      <rect x="${x}" y="6" width="${w}" height="18" rx="4" fill="${color}"/>`
      + (w > 46 ? `<text class="val" x="${x + 8}" y="19" fill="#fff" style="fill:#fff">${v}</text>` : "")
      + `</g>`;
    x += w + 2;
  }
  return `<figure><svg viewBox="0 0 ${W} ${H}" width="100%">${rects}</svg>
    <div class="legend">` + parts.map(([k, label, color, v]) =>
      `<span><i style="background:${color}"></i>${label} ${v}</span>`).join("")
    + `</div><figcaption><b>그림 1.</b> 추적 쌍 n=${s.n_pairs_tracked}
       — '그 팩트를 안 가진 사람 × 팩트' 조합을 무슨 일이 있었는지로 나눈 것.
       받아서 말한 것만 전달로 세고, '끝까지 모름'은 관측이 끝날 때까지 안 받았다는 뜻이다
       (안 받았다고 단정하지 않는다).</figcaption></figure>`;
}

/* 그림 2 — 팩트별 전달 폭: 수평 막대 (엄격 진한 청 + 상한 연한 청 연장, 직접 라벨) */
function figTSR(fm) {
  const rows = fm.slice().sort((a, b) => (b.TSR ?? -1) - (a.TSR ?? -1));
  const W = 660, LAB = 120, BARW = W - LAB - 90, RH = 22;
  const H = rows.length * RH + 6;
  let g = "";
  rows.forEach((f, i) => {
    const y = i * RH + 4;
    const den = f.n_exposed || 0;
    const w1 = den ? (f.B / den) * BARW : 0;
    const w2 = den ? (f.B_upper / den) * BARW : 0;
    g += `<text x="${LAB - 8}" y="${y + 12}" text-anchor="end"
           style="${f.excluded ? "text-decoration:line-through" : ""}">${f.critical ? "★" : ""}${f.fact_id.replace("fact_", "")}</text>
      <rect x="${LAB}" y="${y + 3}" width="${BARW}" height="10" fill="#f0efec" rx="4"/>
      <g data-tip="${f.fact_id} — 볼 기회 ${den}명 중 받아서 말함 ${f.B}명 (상한 ${f.B_upper}) = 전달 폭 ${PCT(f.TSR)}">`
      + (w2 > 0 ? `<rect x="${LAB}" y="${y + 3}" width="${Math.max(w2, 2)}" height="10" fill="var(--c1l)" rx="4"/>` : "")
      + (w1 > 0 ? `<rect x="${LAB}" y="${y + 3}" width="${Math.max(w1, 2)}" height="10" fill="var(--c1)" rx="4"/>` : "")
      + `<rect x="${LAB}" y="${y}" width="${BARW}" height="16" fill="transparent"/></g>
      <text class="val" x="${LAB + BARW + 8}" y="${y + 12}">${PCT(f.TSR)}</text>`;
  });
  return `<figure><svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>
    <div class="legend"><span><i style="background:var(--c1)"></i>엄격하게 센 것</span>
    <span><i style="background:var(--c1l)"></i>노출된 그 라운드의 발화까지 포함한 상한</span></div>
    <figcaption><b>그림 2.</b> 팩트별 TSR — 그 팩트를 원래 안 가졌는데 볼 기회가 생긴 사람 중
      실제로 받아서 말한 사람의 비율. 높은 순이며, 취소선은 질문 문면만 읽어도 알 수 있어
      전달을 잴 수 없다고 빼둔 팩트다(영점 조정).</figcaption></figure>`;
}

/* 그림 3 — 획득 hazard: age별 세로 막대 */
function figHazard(lt) {
  const W = 400, H = 120, PAD = 34, BW = 34;
  const maxH = Math.max(...lt.map(r => r.h_acq || 0), 0.0001);
  let g = `<line x1="${PAD}" y1="${H - 22}" x2="${W - 6}" y2="${H - 22}" stroke="var(--rule-strong)"/>`;
  lt.forEach((r, i) => {
    const x = PAD + 14 + i * (BW + 22);
    const h = (r.h_acq || 0) / maxH * (H - 50);
    g += `<g data-tip="노출 ${r.age}바퀴 뒤: 아직 결과 안 난 쌍 ${r.at_risk}, 받아서 말함 ${r.acquisitions}, 비율 ${F(r.h_acq)}">
      <rect x="${x}" y="${H - 22 - Math.max(h, 2)}" width="${BW}" height="${Math.max(h, 2)}"
        fill="var(--c1)" rx="4"/>
      <text class="val" x="${x + BW / 2}" y="${H - 26 - Math.max(h, 2)}" text-anchor="middle">${F(r.h_acq)}</text>
      <text class="axis" x="${x + BW / 2}" y="${H - 8}" text-anchor="middle">${r.age}바퀴 뒤</text></g>`;
  });
  return `<figure><svg viewBox="0 0 ${W} ${H}" width="${W}px">${g}</svg>
    <figcaption><b>그림 3.</b> 처음 본 뒤 몇 바퀴 만에 자기 입으로 말하나
      (그 시점에 아직 안 받은 사람만 분모로, 엄격(u≥1)).</figcaption></figure>`;
}

async function loadRuns() {
  document.getElementById("nav").innerHTML = `<a href="/biography">전기</a><a href="/ledger">장부</a><a class="here" href="/transmission">레이더</a><a href="/audit">대조</a>`;
  const data = await (await fetch("/api/runs")).json();
  const sel = document.getElementById("runsel"); sel.innerHTML = "";
  const el = data.runs.filter(r => r.parts && r.parts.judgment === "present");
  for (const r of el) {
    const o = document.createElement("option");
    o.value = r.issue_id + "/" + r.run_id;
    o.textContent = `${r.issue_id} / ${r.run_id}`;
    sel.appendChild(o);
  }
  sel.onchange = () => load(sel.value);
  if (el.length) load(sel.value);
}

async function load(key) {
  const [issue, run] = key.split("/");
  const res = await fetch(`/api/transmission/${issue}/${run}`);
  const sheet = document.getElementById("sheet");
  if (!res.ok) { sheet.innerHTML = `<p>${(await res.json()).detail}</p>`; return; }
  const d = await res.json();
  const s = d.system, lp = d.system_low_prior, zp = d.zero_point;
  const zpMark = zp && zp.note ? `<sup>1</sup>` : "";

  const lead1 = `그 팩트를 안 가진 사람과 팩트를 짝지어 <b>${s.n_pairs_tracked}쌍</b>을 따라갔다. `
    + `엄격(u≥1)<sup>2</sup>으로 받아서 말한 것은 <b>${s.n_acq_strict}건</b>`
    + `(TSR ${PCT(s.tsr_system)}${zpMark})이고, 들은 그 라운드에 바로 말한 ${s.n_acq_u0}건까지 `
    + `포함하면 ${PCT(s.tsr_system_upper)}${zpMark}까지 올라간다. `
    + `어디서 받았는지는 상한에 든 것까지 함께 세면 — 남의 발화로 ${s.by_channel.organic} · `
    + `장부로 다시 넣어줘서 ${s.by_channel.ledger} · 둘 섞임 ${s.by_channel.mixed}건이다`
    + `(엄격 셈 ${s.n_acq_strict}건이 아니라 상한 쪽 숫자다 — 경로는 상한 기준으로만 나뉘어 있다).`;
  const lead2 = `원래 알고 있었을 가능성이 낮은 층(사전 지식 낮음)만 보면 `
    + `TSR은 <b>${PCT(lp.tsr_system)}</b>이다(${lp.n_pairs_tracked}쌍 중 ${lp.n_acq_strict}건). `
    + `이 층이 전달을 판정하는 기준 층이다 — 원래 알던 것과 받은 것이 섞이지 않기 때문이다.`;

  const factRows = d.fact_metrics.map(f => `<tr class="${f.excluded ? "excl" : ""}">
      <td>${f.critical ? "★ " : ""}${f.fact_id}${f.excluded ? `<sup>3</sup>` : ""}</td>
      <td>${F(f.prior_band)}</td>
      <td class="num">${F(f.n_nonholders)}</td><td class="num">${F(f.n_exposed)}</td>
      <td class="num">${F(f.B)}</td><td class="num">${F(f.B_upper)}</td>
      <td class="num">${PCT(f.TSR)}</td></tr>`).join("");

  const lt = (d.life_strict && d.life_strict.life_table) || [];
  const lifeRows = lt.map(r => `<tr><td class="num">${r.age}</td>
    <td class="num">${F(r.at_risk)}</td><td class="num">${F(r.acquisitions)}</td>
    <td class="num">${F(r.censored)}</td><td class="num">${F(r.h_acq)}</td></tr>`).join("");

  const j = d.meta || {};
  sheet.innerHTML = `
    <h1>말이 남에게 옮겨갔는지 보는 보고서</h1>
    <div class="subtitle">${d.audit.issue_id} · ${d.audit.run_id} — 한 사람이 말한 팩트를 다른 사람이 받아서 말했나</div>
    <div class="statusline">지위: 층1 팀 확정(2026-07-29) · <b>용도 한정 — 논문 재현용이며 본실험 주지표가 아님</b>
      (본실험 과정 관측은 개인 수첩 원문) · ${d.protocol}</div>


    <p class="lead">${lead1}</p>
    ${figKinds(s)}
    <p class="lead">${lead2}</p>

    <h2><span class="no">1</span>어떤 조건에서 잰 것인가</h2>
    <p class="lead" style="font-size:13.5px">에이전트 ${F(j.n_agents)}명 ·
      라운드 ${(j.rounds || []).length}바퀴 · 팩트 ${F(j.n_facts)}개 ·
      누가 누구 말을 듣는가 ${j.edges ? j.edges.structure + (j.edges.assumed_full ? "(가정)" : "") : "—"} ·
      영점 조정 ${zp && zp.applied ? "적용(" + zp.question_exposed_ids.length + "개 제외)" : "안 함<sup>1</sup>"} ·
      사건 기록 ${d.records.length}건</p>

    <h2><span class="no">2</span>팩트마다 몇 명에게 옮겨갔나</h2>
    ${figTSR(d.fact_metrics)}
    <details><summary>표 A — 팩트별 수치 전량</summary><table>
      <tr><th>팩트</th><th>prior</th><th class="num">안 가진 사람</th><th class="num">볼 기회 있었음</th>
          <th class="num">받아서 말함</th><th class="num">상한</th><th class="num">TSR</th></tr>
      ${factRows}</table></details>

    <h2><span class="no">3</span>처음 본 뒤 몇 바퀴 만에 말하나</h2>
    ${lt.length ? figHazard(lt) : "<p class='lead'>계산할 자료가 없음</p>"}
    <details><summary>표 B — 바퀴별 수치 전량</summary><table style="max-width:460px">
      <tr><th class="num">노출 후</th><th class="num">at risk</th><th class="num">받아서 말함</th>
          <th class="num">검열</th><th class="num">비율</th></tr>
      ${lifeRows}</table></details>

    <div class="footnotes">
      ${zp && zp.note ? `<p><sup>1</sup> ${zp.note}</p>` : ""}
      <p><sup>2</sup> 엄격(u≥1) = 처음 본 <b>다음</b> 라운드부터의 첫 언급만 전달로 센다.
         들은 그 라운드에 바로 말한 것은 창 안에서 되울린 것일 수 있어 상한에만 넣는다(전문어: u≥1 / u=0).</p>
      <p><sup>3</sup> 취소선 = 질문 문면만 읽어도 알 수 있는 팩트. 항상 노출된 셈이라 전달을 잴 수 없어 뺀다.</p>
      <p class="audit">잣대는 채점기 판정 하나(judge.SURVIVING)를 공유한다 · 판정물 지문 = ${d.audit.judgment_sha256} ·
         이 보고서의 모든 수치는 산출물에서 읽어 온 것이고 뷰어는 아무것도 쓰지 않는다.</p>
    </div>`;
  tipOn(sheet);
}
loadRuns();
</script>
</body>
</html>
