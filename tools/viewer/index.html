<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팩트 생존 뷰어 — 파이프라인</title>
<style>
  .viz-root{
    color-scheme:light;
    --surface:#fcfcfb; --page:#f9f9f7; --raise:#ffffff;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --good:#0ca30c; --good-ink:#006300;
    --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --accent:#2a78d6;
    --measure:#1baf7a; --intervene:#d03b3b;
  }
  @media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .viz-root{
    color-scheme:dark;
    --surface:#1a1a19; --page:#0d0d0d; --raise:#212120;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --good:#0ca30c; --good-ink:#0ca30c; --accent:#3987e5; --measure:#199e70;
  }}
  :root[data-theme="dark"] .viz-root{
    color-scheme:dark;
    --surface:#1a1a19; --page:#0d0d0d; --raise:#212120;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --good:#0ca30c; --good-ink:#0ca30c; --accent:#3987e5; --measure:#199e70;
  }
  *{box-sizing:border-box}
  body{margin:0}
  .viz-root{min-height:100vh;display:flex;flex-direction:column;background:var(--page);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 22px 10px}
  h1{font-size:16px;font-weight:640;margin:0;letter-spacing:-.15px}
  h1 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
  select{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--baseline);
    background:var(--surface);color:var(--ink);cursor:pointer}
  select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .spacer{flex:1}
  .toggle{font:inherit;font-size:13px;width:34px;height:34px;border-radius:8px;border:1px solid var(--baseline);
    background:var(--surface);color:var(--ink2);cursor:pointer}
  .legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 22px 10px;font-size:12px;color:var(--ink2);align-items:center}
  .lg{display:inline-flex;align-items:center;gap:6px}
  .lg .sw{width:14px;height:11px;border-radius:3px;display:inline-block;border:1.5px solid}
  main{flex:1;display:flex;min-height:0;gap:14px;padding:0 18px 18px}
  .diagram{flex:0 0 400px;overflow:auto;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:10px}
  .diagram svg{width:100%;height:auto;display:block}
  aside{flex:1;min-width:340px;overflow:auto;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:16px 18px}
  aside h2{font-size:14px;margin:0 0 4px;font-weight:640}
  aside .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  aside .muted{color:var(--muted);font-size:12px;line-height:1.65}
  .callout{background:var(--raise);border:1px solid var(--grid);border-radius:9px;padding:10px 12px;margin-bottom:10px;font-size:12.5px}
  .callout.warn{border-color:var(--warning)}
  /* SVG 노드 */
  .node rect{stroke-width:1.5;rx:10}
  .node text{font-family:system-ui,sans-serif;fill:var(--ink)}
  .node.sel rect{stroke:var(--ink);stroke-width:2.5}
  .node{cursor:pointer}
  .edge{stroke:var(--baseline);stroke-width:1.5;fill:none}
  .edgelabel{fill:var(--muted);font-size:10px;font-family:system-ui}
  .loopbox{fill:none;stroke:var(--baseline);stroke-width:1;stroke-dasharray:4 4}
  .looptext{fill:var(--muted);font-size:10px}
  /* 매트릭스 (채점기 상세) */
  table.mx{border-collapse:separate;border-spacing:4px;margin-top:6px}
  table.mx th{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:2px 5px}
  table.mx th.far{font-weight:500;font-variant-numeric:tabular-nums}
  td.fact{font-size:12px;color:var(--ink);max-width:280px;padding:2px 8px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.fact .fid{color:var(--muted);font-size:10px;margin-right:5px}
  td.cell{width:52px;height:30px;border-radius:7px;text-align:center;font-size:12px;font-weight:600;
    cursor:pointer;background:var(--surface);border:1px solid var(--grid);color:var(--muted)}
  td.cell.s-accepted{background:var(--good);border-color:var(--good);color:#fff}
  td.cell.s-mentioned{background:color-mix(in srgb,var(--good) 16%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--surface));color:var(--good-ink)}
  td.cell.s-unmentioned{background:color-mix(in srgb,var(--serious) 20%,var(--surface));border-color:color-mix(in srgb,var(--serious) 55%,var(--surface));color:var(--ink)}
  td.cell.s-ignored{background:color-mix(in srgb,var(--warning) 26%,var(--surface));border-color:color-mix(in srgb,var(--warning) 60%,var(--surface));color:var(--ink)}
  td.cell.s-refuted{background:var(--critical);border-color:var(--critical);color:#fff}
  td.cell.s-absent{border-style:dashed;border-color:var(--baseline)}
  td.cell.injected{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
  /* facts/assignment 목록 */
  .row{border:1px solid var(--grid);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;background:var(--raise)}
  .row .head{font-size:11px;color:var(--ink2);margin-bottom:3px;font-weight:600}
  .tag{font-size:10px;color:var(--muted);margin-right:5px}
  .star{color:var(--warning)}
  .prior{height:5px;border-radius:3px;background:var(--accent);margin-top:5px}
  .priortrack{height:5px;border-radius:3px;background:var(--grid)}
  .utt{border:1px solid var(--grid);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;line-height:1.55;background:var(--raise)}
  .utt .who{font-size:11px;color:var(--ink2);margin-bottom:3px;font-weight:600}
  /* 분석 바 */
  .metric{margin:10px 0}
  .metric .lbl{font-size:11px;color:var(--ink2);margin-bottom:4px;display:flex;justify-content:space-between}
  .metric .lbl b{font-variant-numeric:tabular-nums;color:var(--ink)}
  .track{height:9px;border-radius:5px;background:var(--grid);overflow:hidden}
  .fill{height:9px;border-radius:5px;background:var(--serious)}
  .fill.hz{background:var(--critical)}
  .fill.km{background:var(--good)}
  #tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--page);font-size:11px;padding:6px 9px;border-radius:7px;max-width:280px;z-index:9;display:none;line-height:1.45}
</style>
</head>
<body>
<div class="viz-root">
  <div class="bar">
    <h1>팩트 생존 뷰어 <small>파이프라인 지도</small></h1>
    <select id="runsel"></select>
    <div class="spacer"></div>
    <button class="toggle" id="themebtn" title="라이트/다크">◐</button>
  </div>
  <div class="legend">
    <span class="lg"><span class="sw" style="border-color:var(--measure);background:color-mix(in srgb,var(--measure) 14%,var(--surface))"></span>측정 계열</span>
    <span class="lg"><span class="sw" style="border-color:var(--intervene);border-style:dashed;background:color-mix(in srgb,var(--intervene) 10%,var(--surface))"></span>개입 계열 — 끄면 대조군, 켜면 실험군</span>
    <span class="lg"><span class="sw" style="border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))"></span>토론 허브</span>
    <span class="muted">엣지 라벨 = 파일 계약 · 노드 클릭 = 그 단계 데이터</span>
  </div>
  <main>
    <div class="diagram"><svg id="svg" viewBox="0 0 440 940" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside id="panel"></aside>
  </main>
  <div id="tip"></div>
</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS="http://www.w3.org/2000/svg";
const S={accepted:{g:"인",label:"인정 · 생존"},mentioned:{g:"언",label:"언급 · 생존"},
  unmentioned:{g:"미",label:"미언급 · 소실"},ignored:{g:"무",label:"무시 · 소실"},
  refuted:{g:"반",label:"반박 · 소실"},absent:{g:"·",label:"기록 없음"}};

let CUR=null;          // {issue_id, run_id}
const cache={issue:{},facts:{},asg:{},vm:{},an:{}};

// 노드 정의: kind = measure|intervene|hub|neutral
const NODES=[
  {id:"loader",  label:"데이터 로더", sub:"issue → 본문",      x:40, y:20,  kind:"neutral"},
  {id:"extract", label:"팩트 추출기", sub:"원자 팩트 + prior", x:40, y:130, kind:"measure"},
  {id:"assign",  label:"배분기",     sub:"에이전트별 배분",   x:40, y:240, kind:"neutral"},
  {id:"debate",  label:"토론 엔진",   sub:"8명 × N라운드",     x:40, y:360, kind:"hub"},
  {id:"judge",   label:"채점기",     sub:"라운드별 생존 판정", x:250,y:360, kind:"measure"},
  {id:"ledger",  label:"장부 (스위치)",sub:"소실분 재주입 on/off",x:250,y:470, kind:"intervene"},
  {id:"gate",    label:"합의 전 게이트",sub:"합의문 ↔ 장부 대조",x:40, y:600, kind:"intervene"},
  {id:"analysis",label:"분석 · 리포트",sub:"FAR·hazard·fact-clock",x:40,y:710, kind:"neutral"},
];
const NW=180, NH=64;
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
function fill(k){return k==="measure"?"color-mix(in srgb,var(--measure) 14%,var(--surface))":
  k==="intervene"?"color-mix(in srgb,var(--intervene) 10%,var(--surface))":
  k==="hub"?"color-mix(in srgb,var(--accent) 12%,var(--surface))":"var(--surface)";}
function stroke(k){return k==="measure"?"var(--measure)":k==="intervene"?"var(--intervene)":
  k==="hub"?"var(--accent)":"var(--baseline)";}

const EDGES=[  // [from,to,label,side]  side: v(vertical spine) or custom
  ["loader","extract","issues"],
  ["extract","assign","facts"],
  ["assign","debate","assignments"],
  ["debate","gate","judgments"],
  ["gate","analysis","metrics"],
];
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};

function drawDiagram(){
  const svg=document.getElementById("svg"); svg.innerHTML="";
  // 화살표 마커
  const defs=mk("defs");
  const m=mk("marker",{id:"ar",markerWidth:8,markerHeight:8,refX:6,refY:3,orient:"auto"});
  m.appendChild(mk("path",{d:"M0,0 L6,3 L0,6 Z",fill:"var(--baseline)"})); defs.appendChild(m); svg.appendChild(defs);
  // 결합 루프 영역 (debate·judge·ledger)
  const box=mk("rect",{x:28,y:348,width:410,height:200,rx:12,class:"loopbox"}); svg.appendChild(box);
  svg.appendChild(Object.assign(mk("text",{x:36,y:344,class:"looptext"}),{textContent:"실행 시점 결합 — 유일 결합점 (장부 on/off = 실험/대조)"}));
  // 세로 스파인 엣지
  const cx=n=>n.x+NW/2, cy=n=>n.y+NH/2;
  EDGES.forEach(([a,b,lbl])=>{
    const A=byId[a],B=byId[b];
    svg.appendChild(mk("line",{x1:cx(A),y1:A.y+NH,x2:cx(B),y2:B.y,class:"edge","marker-end":"url(#ar)"}));
    svg.appendChild(Object.assign(mk("text",{x:cx(A)+6,y:(A.y+NH+B.y)/2+3,class:"edgelabel"}),{textContent:lbl}));
  });
  // 루프 엣지: debate→judge, judge→ledger, ledger→debate
  const D=byId.debate,J=byId.judge,L=byId.ledger;
  svg.appendChild(mk("line",{x1:D.x+NW,y1:cy(D),x2:J.x,y2:cy(J),class:"edge","marker-end":"url(#ar)"}));
  svg.appendChild(mk("line",{x1:cx(J),y1:J.y+NH,x2:cx(L),y2:L.y,class:"edge","marker-end":"url(#ar)"}));
  // ledger→debate 되돌림 (아래로 돌아 왼쪽)
  svg.appendChild(mk("path",{d:`M${L.x},${cy(L)} L${D.x+NW+14},${cy(L)} L${D.x+NW+14},${cy(D)+18} L${D.x+NW},${cy(D)+18}`,class:"edge",fill:"none","marker-end":"url(#ar)"}));
  // 노드
  NODES.forEach(n=>{
    const g=mk("g",{class:"node","data-id":n.id});
    g.appendChild(mk("rect",{x:n.x,y:n.y,width:NW,height:NH,rx:10,fill:fill(n.kind),stroke:stroke(n.kind),
      "stroke-width":1.5,"stroke-dasharray":n.kind==="intervene"?"5 3":"0"}));
    g.appendChild(Object.assign(mk("text",{x:n.x+NW/2,y:n.y+26,"text-anchor":"middle","font-size":13,"font-weight":650}),{textContent:n.label}));
    g.appendChild(Object.assign(mk("text",{x:n.x+NW/2,y:n.y+45,"text-anchor":"middle","font-size":10.5,fill:"var(--muted)"}),{textContent:n.sub}));
    g.onclick=()=>selectNode(n.id);
    svg.appendChild(g);
  });
}
function markSel(id){document.querySelectorAll(".node").forEach(g=>g.classList.toggle("sel",g.getAttribute("data-id")===id));}

async function j(url){const r=await fetch(url);if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||r.status);}return r.json();}
async function getVM(){const k=CUR.issue_id+"|"+CUR.run_id;return cache.vm[k]??=await j(`/api/viewmodel/${CUR.issue_id}/${CUR.run_id}`);}

async function selectNode(id){
  markSel(id);
  const p=document.getElementById("panel");
  p.innerHTML=`<div class="muted">불러오는 중…</div>`;
  try{
    if(id==="loader"){const d=cache.issue[CUR.issue_id]??=await j(`/api/issue/${CUR.issue_id}`);renderLoader(d);}
    else if(id==="extract"){const d=cache.facts[CUR.issue_id]??=await j(`/api/facts/${CUR.issue_id}`);renderFacts(d);}
    else if(id==="assign"){const d=cache.asg[CUR.issue_id]??=await j(`/api/assignment/${CUR.issue_id}`);renderAssign(d);}
    else if(id==="debate"){renderDebate(await getVM());}
    else if(id==="judge"){renderJudge(await getVM());}
    else if(id==="ledger"||id==="gate"){renderLedger(await getVM(),id);}
    else if(id==="analysis"){const k=CUR.issue_id+"|"+CUR.run_id;const d=cache.an[k]??=await j(`/api/analysis/${CUR.issue_id}/${CUR.run_id}`);renderAnalysis(d);}
  }catch(e){p.innerHTML=`<h2>${byId[id].label}</h2><div class="callout warn">데이터 없음: ${esc(e.message)}</div>`;}
}

function H(title,sub){return `<h2>${esc(title)}</h2><div class="sub">${esc(sub||"")}</div>`;}

function renderLoader(d){
  const sm=d.source_meta||{};
  document.getElementById("panel").innerHTML=H("데이터 로더 · issue",`${esc(d.issue_id)} · source ${esc(d.source)}`)+
    `<div class="callout"><b>${esc(d.title)}</b></div>`+
    `<div class="row"><div class="head">본문</div>${esc(d.body)}</div>`+
    `<div class="row"><div class="head">source_meta</div>`+
    `usage_approved: <b>${esc(String(sm.usage_approved))}</b> · url: ${esc(String(sm.url))} · fetched_at: ${esc(String(sm.fetched_at))}</div>`;
}
function renderFacts(d){
  const fs=d.facts||[];
  document.getElementById("panel").innerHTML=H("팩트 추출기 · facts",`${fs.length}개 · critical ${fs.filter(f=>f.critical).length} · extractor ${esc((d.extractor||{}).model||"?")}`)+
    fs.map(f=>{const p=(f.prior||{}).score;return `<div class="row"><div class="head">${esc(f.fact_id.replace(/^fact_/,""))} ${f.critical?'<span class="star">★</span>':""} <span class="tag">${(f.tags||[]).map(t=>"#"+esc(t)).join(" ")}</span></div>`+
      esc(f.text)+ (p!=null?`<div class="priortrack"><div class="prior" style="width:${Math.round(p*100)}%"></div></div><div class="muted" style="margin-top:2px">prior ${p}</div>`:"")+`</div>`;}).join("");
}
function renderAssign(d){
  const ag=d.agents||[];
  document.getElementById("panel").innerHTML=H("배분기 · assignment",`seed ${esc(String(d.seed))} · ${ag.length} 에이전트 (비대칭 배분)`)+
    `<div class="callout muted">주의: dryrun 발화 로그의 perspective 라벨이 placeholder("관점A(TODO)")인 경우가 있어, 여기 assignment 값을 기준으로 표시합니다.</div>`+
    ag.map(a=>`<div class="row"><div class="head">${esc(a.agent_id)} · ${esc(a.perspective)} · <b>${esc(a.stance)}</b></div>`+
      `배분 팩트: ${(a.assigned_fact_ids||[]).map(x=>esc(x.replace(/^fact_/,""))).join(", ")}</div>`).join("");
}
function renderDebate(vm){
  const stages=vm.stages||[];let html=H("토론 엔진 · 발화",`${esc(vm.meta.run_id)} · ledger ${esc(vm.meta.ledger_mode)} · ${stages.length} 라운드`);
  stages.forEach(n=>{const us=vm.utterances[String(n)]||[];
    html+=`<div class="row"><div class="head">R${n} · 발화 ${us.length}건</div>`+
      us.map(u=>`<div class="utt"><div class="who">${esc(u.agent_id)}${u.perspective?" · "+esc(u.perspective):""}${u.stance?" · "+esc(u.stance):""}</div>${esc(u.text)}</div>`).join("")+`</div>`;});
  document.getElementById("panel").innerHTML=html;
}
function renderJudge(vm){
  const p=document.getElementById("panel");
  p.innerHTML=H("채점기 · 생존 매트릭스",`${esc(vm.meta.run_id)} · judge ${esc((vm.meta.judge||{}).model||"?")} · 팩트 ${vm.meta.n_facts}`);
  const inj={}; (vm.injects||[]).forEach(i=>inj[String(i.round)]=i.fact_ids);
  const tbl=document.createElement("table");tbl.className="mx";
  const hr=document.createElement("tr");hr.innerHTML=`<th style="text-align:left">팩트</th>`+
    vm.stages.map(n=>{const r=(vm.far_by_stage||[]).find(x=>String(x.stage)===String(n));const far=r&&r.far_system!=null?`<div class="far">FAR ${r.far_system}</div>`:"";return `<th>R${n}${far}</th>`;}).join("");
  tbl.appendChild(hr);
  vm.facts.forEach(f=>{
    const tr=document.createElement("tr");
    let row=`<td class="fact"><span class="fid">${esc(f.fact_id.replace(/^fact_/,""))}</span>${f.critical?'<span class="star">★</span> ':""}${esc(f.text)}</td>`;
    vm.stages.forEach(n=>{const c=(vm.matrix[f.fact_id]||{})[String(n)]||{status:"absent"};
      const injd=(inj[String(n)]||[]).includes(f.fact_id)?" injected":"";
      row+=`<td class="cell s-${c.status}${injd}" title="R${n} · ${esc(S[c.status].label)}${c.agents&&c.agents.length?" · 언급:"+esc(c.agents.join(",")):""}">${S[c.status].g}</td>`;});
    tr.innerHTML=row;tbl.appendChild(tr);
  });
  p.appendChild(tbl);
}
function renderLedger(vm,which){
  const injects=vm.injects||[];
  const off=(vm.meta.ledger_mode||"off")==="off";
  const title=which==="gate"?"합의 전 게이트":"장부 (스위치)";
  let html=H(title,`${esc(vm.meta.run_id)} · ledger_mode ${esc(vm.meta.ledger_mode)}`);
  if(off||!injects.length){
    html+=`<div class="callout warn"><b>대조군 (ledger off)</b> — 이 run은 장부 재주입·게이트 대조 이벤트가 없습니다.<br>
      <span class="muted">장부를 켠(on) run이 생기면 여기에 재주입된 소실 팩트와 게이트 롤백이 표시됩니다. off/on = 대조군/실험군.</span></div>`;
  }else{
    html+=injects.map(i=>`<div class="row"><div class="head">R${i.round} 재주입</div>${(i.fact_ids||[]).map(x=>esc(x.replace(/^fact_/,""))).join(", ")}</div>`).join("");
  }
  document.getElementById("panel").innerHTML=html;
}
function bar(lbl,val,cls,max){const w=max?Math.min(100,Math.round((val/max)*100)):Math.round((val||0)*100);
  return `<div class="metric"><div class="lbl"><span>${esc(lbl)}</span><b>${val==null?"—":val}</b></div><div class="track"><div class="fill ${cls||''}" style="width:${val==null?0:w}%"></div></div></div>`;}
function renderAnalysis(d){
  const rep=d.report||{}, fc=d.fact_clock||{};
  let html=H("분석 · 리포트 · survival",`${esc(d.issue_id)} / ${esc(d.run_id)} · surviving=${(fc.surviving_set||[]).join("+")}`);
  // FAR by stage
  html+=`<div class="callout"><div class="head" style="font-size:11px;color:var(--ink2);margin-bottom:6px;font-weight:600">전체 FAR (단계별)</div>`+
    (rep.far_by_stage||[]).map(s=>bar(`R${s.stage}`, s.far, "")).join("")+`</div>`;
  // 조건부 hazard (transitions)
  html+=`<div class="callout"><div class="head" style="font-size:11px;color:var(--ink2);margin-bottom:6px;font-weight:600">조건부 소실률 (hazard) — 생존자 중 다음 단계 이탈</div>`+
    (rep.transitions||[]).map(t=>bar(`R${t.from_stage}→R${t.to_stage} (모수 ${t.surviving_denom}, 소실 ${t.lost})`, t.cond_attrition, "hz")).join("")+
    `<div class="muted" style="margin-top:4px">누적 도입후 최종생존 소실: ${(rep.post_intro_final_loss||{}).rate}</div></div>`;
  // fact-clock KM
  const w0=(fc.by_w||{})[0]||{}, w1=(fc.by_w||{})[1]||{};
  const km=(o)=> (o.survival||[]).map(s=>`R${s.age}:${s.S}`).join("  ");
  html+=`<div class="callout"><div class="head" style="font-size:11px;color:var(--ink2);margin-bottom:6px;font-weight:600">fact-clock KM 생존 (도입 정렬)</div>`+
    `<div class="muted">w=0: ${esc(km(w0))} · 사망 ${w0.n_deaths_total}</div>`+
    `<div class="muted">w=1: ${esc(km(w1))} · 사망 ${w1.n_deaths_total}</div>`;
  const wd=fc.w_divergence;
  if(wd)html+=`<div style="margin-top:8px" class="muted">w=0→1 분해 — robust 사망 <b>${wd.counts.death_robust}</b> · 재등장(churn) <b>${wd.counts.churn_reappearance}</b> · 관측창부족 아티팩트 <b>${wd.counts.artifact_terminal_silence}</b></div>`;
  html+=`</div>`;
  document.getElementById("panel").innerHTML=html;
}

// 부트스트랩
document.getElementById("themebtn").onclick=()=>{const r=document.documentElement;const c=r.getAttribute("data-theme");
  r.setAttribute("data-theme", c==="dark"?"light":(c==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark")));};
async function boot(){
  drawDiagram();
  const {runs}=await j("/api/runs");
  const sel=document.getElementById("runsel");
  if(!runs.length){document.getElementById("panel").innerHTML=`<div class="callout warn">가용 run 없음</div>`;return;}
  runs.forEach(r=>{const o=document.createElement("option");o.value=r.issue_id+"|"+r.run_id;
    o.textContent=`${r.title} · ${r.run_id} · judge ${r.judge||"?"}`;sel.appendChild(o);});
  sel.onchange=()=>{const [i,rn]=sel.value.split("|");CUR={issue_id:i,run_id:rn};selectNode("judge");};
  const first=sel.options[0].value.split("|");
  CUR={issue_id:first[0],run_id:first[1]};
  selectNode("judge");  // 기본: 채점기(매트릭스)
}
boot();
</script>
