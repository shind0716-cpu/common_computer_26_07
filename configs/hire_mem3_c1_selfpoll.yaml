# 통제 C1: 폴링 격리 (mem3-c1-selfpoll)
# 적대적 리뷰 v1 치명 1 — ①③ 의 폴링 입력에 이웃 3명의 마지막 발언이 전부 들어간다
# (structure=full). 그 프롬프트만 읽어도 답이 나오므로 만점이 기억 조건의 결과인지
# 폴링 입력의 결과인지 갈리지 않는다.
#
# 이 팔은 **이미 완주한 ③ 직전만 run 을 그대로 두고** 폴링만 다시 던진다. 입력에서
# 이웃 발언을 빼고 자기 마지막 발언만 남긴다. 같은 토론 위의 짝지은 대조라
# 토론 자체는 재실행하지 않는다(콜 4/런).
#
# 읽는 법: ③ 이 20/20 인데 여기서 떨어지면, 그 만점은 폴링 프롬프트가 준 것이다.
experiment: hire_mem3_c1_selfpoll
condition: mem3-c1-selfpoll
issue_id: issue_hire
seed: 42
agents: 4
rounds: 3                 # 원 토론의 라운드 수(참고용 — 이 러너는 토론을 돌리지 않는다)
window: rolling           # 원 토론(③)의 좌표를 그대로 적는다
poll_context: self_utterance
poll_intro: discussed     # 실제로 논의가 있었으므로 원 문면 유지
debate_model: glm         # = glm-5.2 (본 팔들과 동일)
debate_temperature: 1.0
reasoning: "off"
ledger_mode: "off"
max_llm_calls: 4
