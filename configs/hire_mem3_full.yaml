# 조건: 전체기억 (mem3-full) — 기억 축 3점 대조의 ① 좌표.
# 설정 사전 좌표: 협력(무입장)·4에이전트·누적 창·수첩 없음·장부 끔·최종 폴링 켬.
#
# 기존 configs/hire_talk_full.yaml 을 쓰지 않는 이유: 그 파일에는 window·memory·
# final_poll 키가 없어 엔진 기본값(rolling·none·폴링 없음)으로 돈다. 이름과 달리
# 누적 창이 아니고 최종 폴링이 없어 정답 대조가 불가능하다. 규약(조건 변경 = 새 yaml,
# 기존 파일 무수정)대로 고치지 않고 새 파일을 만든다.
experiment: hire_mem3_full
condition: mem3-full
issue_id: issue_hire
run_id: rep1              # 정본은 CLI --run. 이 키는 참고용이다.
seed: 42
agents: 4
rounds: 3
window: cumulative        # 받은 발화 누적 전량
memory: none              # 수첩 없음
final_poll: true          # 정답 대조 원자료 (judge 불사용)
debate_model: glm         # = glm-5.2 (자체 호스팅 · .env 의 GLM_BASE_URL)
debate_temperature: 1.0
reasoning: "off"       # GLM 사고 끄기(enable_thinking=false) — 켜면 본문 예산 잠식·절단
ledger_mode: "off"
max_llm_calls: 20         # 발화 16(4명 x 초기+3라운드) + 최종폴링 4
