": "계약·재정", "text": "저라면 **룸메이트를 집주인에게 신고하지 않겠습니다.**\n\n이유는 간단해요. **계약 위반 시 보증금 500달러가 몰수된다**는 점이 크고, 자칫하면 상황만 더 악화될 수 있기 때문입니다. 또 **신고된 반려동물은 월 40달러의 추가 비용이 있다**고 해서, 신고가 곧바로 문제 해결로 이어지는 것도 아니고 오히려 비용 부담만 늘어날 수 있어요. 게다가 **ESA는 법적으로 일반 반려동물 금지 조항의 예외가 될 수 있다**는 점도 고려해야 합니다. 이런 경우라면 먼저 집주인에게 바로 신고하기보다, 룸메이트와 상의하거나 상황을 조심스럽게 정리하는 편이 낫다고 생각합니다."}, {"agent_id": "agent_3", "perspective": "건강·복지", "text": "룸메이트를 집주인에게 신고하는 쪽이 맞다고 생각해요. 제 친구 Jenna는 진단된 불안이 있어서 상황을 더 세심하게 봐야 하지만, 지금은 ESA 서류가 집주인에게 제출되지 않은 상태라서 규정상 문제를 그냥 넘기면 안 될 것 같아요. 게다가 저는 경미한 개털 알레르기가 있어서, 이런 부분도 함께 고려돼야 한다고 봐요. 서로 배려하는 것도 중요하지만, 서류가 정리되지 않은 상태라면 집주인에게 알리는 게 맞습니다."}, {"agent_id": "agent_4", "perspective": "건강·복지", "text": "저는 **아니라고 생각해요**.  \nJenna는 진단된 불안이 있고, 치료사에게서 ESA 추천서를 받았다고 주장하고 있어요. 게다가 Jenna가 비밀로 해달라고 부탁한 만큼, 지금 바로 집주인에게 신고하는 건 너무 성급하다고 봐요. 먼저 상황을 차분히 이해하고, Jenna와 직접 이야기해보는 게 더 좋을 것 같아요."}, {"agent_id": "agent_5", "perspective": "공동생활·관계", "text": "저는 **집주인에게 신고하는 게 맞다**고 생각해요.  \n낮에 개가 짖어서 이웃 항의가 한 차례 있었고, 저도 **경미한 개털 알레르기**가 있어서 생활에 영향이 있습니다. 게다가 **Jenna가 비밀로 해달라고 부탁**했지만, 이런 문제는 숨기기보다 집주인에게 알리고 해결 방안을 찾는 게 더 낫다고 봐요."}, {"agent_id": "agent_6", "perspective": "공동생활·관계", "text": "저는 **룸메이트를 집주인에게 신고하지 않는 쪽**이에요.  \nJenna가 **6주 전 집주인 허락 없이 개를 데려왔고**, 그 개가 **낮에 짖어서 이웃 항의가 한 차례 있었던 건 사실**이라 걱정될 수 있어요. 게다가 **Jenna가 비밀로 해달라고 부탁한 상황**도 있죠.\n\n그래도 저는 바로 신고하기보다는 먼저 Jenna와 다시 이야기해보고, 앞으로 짖는 문제를 줄일 방법을 같이 찾는 게 더 낫다고 생각해요. 지금은 신고보다 대화로 해결을 시도해볼 것 같아요."}, {"agent_id": "agent_7", "perspective": "법·규정", "text": "저는 **네, 집주인에게 신고해야 한다고 생각해요.**\n\n임대차 계약에 **반려동물 금지 조항이 있는데도**, Jenna가 **6주 전 집주인 허락 없이 개를 데려왔고**, 게다가 **ESA 서류도 아직 집주인에게 제출되지 않은 상태**라면 그냥 넘기기 어렵다고 봐요. 계약은 지켜야 하고, 이런 문제는 나중에 더 크게 번질 수 있어서 **집주인에게 알리는 게 맞다**고 생각합니다."}, {"agent_id": "agent_8", "perspective": "법·규정", "text": "저라면 **신고하지 않겠습니다**.\n\nJenna가 치료사에게서 **ESA 추천서를 받았다고 주장**하고 있고, **ESA는 법적으로 일반 반려동물 금지 조항의 예외가 될 수 있기 때문**에, 단순히 집주인에게 바로 신고하는 건 너무 성급하다고 생각해요. 게다가 **임대차 계약 갱신이 3주 뒤**라서, 지금은 더 신중하게 상황을 지켜보고 필요한 경우 계약 조건이나 관련 서류를 먼저 확인하는 게 맞다고 봅니다."}], "1": [{"agent_id": "agent_4", "perspective": "건강·복지", "text": "저는 여전히 **바로 집주인에게 신고하는 건 조심해야 한다**고 생각해요. Jenna가 진단된 불안이 있고 치료사에게서 ESA 추천서를 받았다고 주장하는 만큼, 단순한 무단 반려동물로만 단정하기는 어렵고, **ESA라면 일반적인 반려동물 금지 조항의 예외가 될 수 있다는 점**도 무시할 수 없어요. 다만 다른 분들이 지적한 것처럼 **계약상 반려동물 금지 조항**, **아직 집주인에게 서류가 제출되지 않은 상태**, 그리고 **낮에 짖어서 이웃 항의가 있었고 제 경미한 개털 알레르기도 생활에 영향을 준다**는 점은 분명히 그냥 넘기기엔 찜찜하긴 해요. 그래서 제 생각은, 지금 당장 신고하기보다는 먼저 Jenna와 다시 이야기해서 서류 제출 여부와 짖는 문제를 정리해보고, 정말 해결이 안 되거나 집주인에게 알릴 필요가 분명해질 때 그때 신중하게 대응하는 쪽이에요."}, {"agent_id": "agent_5", "perspective": "공동생활·관계", "text": "저는 여전히 **집주인에게 알리는 쪽이 맞다**고 봐요. Jenna가 치료사에게서 ESA 추천서를 받았다고 주장하는 점이나 ESA가 예외가 될 수 있다는 이야기는 이해하지만, 현재로선 **임대차 계약에 반려동물 금지 조항이 있고**, **집주인 허락 없이 6주 전부터 개를 데려온 상태**이며, **ESA 서류도 아직 제출되지 않았다는 점**이 걸립니다. 게다가 이미 **낮에 짖어서 이웃 항의가 한 번 있었고**, 저도 **경미한 개털 알레르기**가 있어서 그냥 개인적인 문제로 넘기기 어렵다고 생각해요. 물론 Jenna와 먼저 이야기해볼 수도 있지만, 비밀로 해달라는 부탁만으로 계약 위반과 생활 피해를 계속 덮어두는 건 부담이 크고, 결국 더 큰 문제로 번질 수 있으니 저는 집주인에게 알리고 공식적으로 정리하는 게 낫다고 생각합니다."}, {"agent_id": "agent_7", "perspective": "법·규정", "text": "저는 여전히 **집주인에게 알리는 쪽**에 더 가깝다고 생각해요. Jenna가 치료사에게서 ESA 추천서를 받았다고 하고 불안 진단도 있다는 점은 무시할 수 없어서, 처음엔 너무 성급하게 신고하는 건 조심해야 한다는 의견도 이해해요. 하지만 지금 핵심은 **반려동물 금지 조항이 있는 임대차 계약**에서 **허락 없이 개를 들여왔고**, **ESA 서류가 집주인에게 제출되지 않은 상태**라는 점이에요. 게다가 이미 **낮에 짖어서 이웃 항의가 한 차례 있었고**, 저에게도 **경미한 개털 알레르기**가 있어서 그냥 개인 간 문제로만 보기엔 어려워요. 그래서 저는 무조건 바로 고자질하겠다는 뜻은 아니지만, 최소한 **집주인에게 상황을 알려서 공식적으로 정리하는 게 맞다**고 봐요."}, {"agent_id": "agent_8", "perspective": "법·규정", "text": "저는 여전히 **바로 집주인에게 신고하지 않는 쪽**에 가깝습니다. Jenna가 진단된 불안이 있고 치료사에게서 **ESA 추천서를 받았다고 주장**하는 점, 그리고 **ESA가 일반 반려동물 금지 조항의 예외가 될 수 있다**는 점을 보면 단순한 계약 위반으로 바로 단정하기는 어렵다고 생각해요. 물론 개가 **낮에 짖어서 이웃 항의가 한 번 있었고**, 저에게도 **경미한 개털 알레르기**가 있어서 불편한 건 맞지만, 그래도 지금은 먼저 Jenna와 다시 이야기해서 서류가 정말 정리될 가능성이 있는지, 짖는 문제를 줄일 수 있는지 확인해보고 싶어요. 다만 **ESA 서류가 집주인에게 아직 제출되지 않은 상태**라면 그건 계속 신경 쓰이는 부분이라서, 완전히 문제없다고 보진 않아요. 그래서 제 결론은, 당장 신고하기보다는 **대화를 먼저 하고 상황을 정리해보는 쪽**이 더 낫다는 생각입니다."}, {"agent_id": "agent_3", "perspective": "건강·복지", "text": "여전히 저는 **집주인에게 알리는 쪽이 맞다**고 생각해요. Jenna의 불안이나 ESA 가능성 자체는 충분히 이해하지만, 지금은 **ESA 서류가 집주인에게 제출되지 않은 상태**이고 **반려동물 금지 조항**이 있는 계약이라면 그냥 넘어가기 어렵다고 봐요. 게다가 **낮에 짖어서 이웃 항의가 한 차례 있었고**, 저도 **경미한 개털 알레르기**가 있어서 실제로 생활에 영향이 있어요. 물론 Jenna가 비밀로 해달라고 한 점과, 먼저 대화로 풀어보자는 의견도 이해는 하지만, 제 입장에선 이미 다른 사람에게까지 영향을 주고 있고 계약 문제도 걸려 있어서 결국 **집주인에게 알리고 공식적으로 정리하는 게 더 책임 있는 선택**이라고 생각합니다."}, {"agent_id": "agent_6", "perspective": "공동생활·관계", "text": "저는 여전히 **바로 집주인에게 신고하지 않는 쪽**에 조금 더 기울어요. 처음엔 Jenna가 허락 없이 개를 데려왔고 낮에 짖어서 이웃 항의까지 있었다는 점 때문에 신고를 생각할 만하다고 봤지만, 다른 사람들 말처럼 **ESA 추천서가 있고 법적으로 예외가 될 수 있다는 점**은 무시하기 어렵고, 아직 **집주인에게 서류가 제대로 전달되지 않은 상태**라는 것도 바로 신고 전에 한 번 더 확인해야 할 부분 같아요. 또 제가 **경미한 개털 알레르기**가 있어서 생활에 불편이 있는 건 맞지만, 그렇다고 해서 곧바로 신고부터 하기보다 Jenna와 먼저 솔직하게 이야기하고 짖는 문제나 알레르기 문제를 어떻게 줄일지 조정해보는 게 우선이라고 생각해요. 다만 계속 소음이 심해지거나, ESA 관련 서류가 끝내 정리되지 않으면 그때는 집주인에게 알리는 것도 고려할 것 같습니다."}, {"agent_id": "agent_1", "perspective": "계약·재정", "text": "저는 여전히 **집주인에게 알리는 쪽**에 조금 더 기울어요. 이전엔 계약 위반과 보증금 몰수 가능성이 가장 크게 보였고, 지금도 그 점은 변하지 않아요. 다만 다른 분들 말처럼 Jenna가 불안 진단을 받았고 ESA 추천서를 받았다고 주장하는 점, 그리고 ESA가 일반적인 반려동물 금지 조항의 예외가 될 수 있다는 점은 무시할 수 없다고 생각해요. 그래서 무조건 바로 신고부터 하기보다는, 우선 ESA 서류가 실제로 준비됐는지와 집주인에게 제출할 수 있는 상태인지 확인해보고 Jenna와 한 번 더 이야기하는 건 필요해 보여요. 그래도 결국 서류가 없거나 계약상 문제가 계속 남는다면, 제 알레르기와 이웃 민원까지 고려했을 때 집주인에게 알려서 공식적으로 정리하는 게 맞다고 봅니다."}, {"agent_id": "agent_2", "perspective": "계약·재정", "text": "저는 여전히 **바로 집주인에게 신고하지 않는 쪽**에 가깝습니다. Jenna가 진단된 불안이 있고 치료사 추천서가 있다고 했다는 점, 그리고 **ESA라면 일반 반려동물 금지 조항의 예외가 될 수 있다**는 점은 무시할 수 없어요. 물론 **허락 없이 6주 전에 개를 데려온 것**이나 **낮에 짖어서 이웃이 한 번 항의한 것**은 분명 걱정되는 부분이고, 저도 완전히 괜찮다고 보진 않아요. 하지만 현재 **ESA 서류가 아직 집주인에게 제출되지 않은 상태**라고 해도, 바로 신고해서 보증금 500달러 몰수나 갈등을 키우는 건 너무 급하다고 생각해요. 게다가 제가 겪는 **경미한 개털 알레르기**도 있어서 불편함은 있지만, 그래서 더더욱 먼저 Jenna와 대화하면서 짖는 문제와 생활 수칙을 조율해보고, 상황이 정리되지 않을 때 집주인에게 확인하는 순서가 맞다고 봅니다."}], "2": [{"agent_id": "agent_4", "perspective": "건강·복지", "text": "저는 여전히 **바로 집주인에게 신고하는 건 조심해야 한다**는 쪽이에요. Jenna가 불안 진단이 있고 치료사에게서 ESA 추천서를 받았다고 주장하는 만큼, 단순히 허락 없이 개를 들여온 것으로만 보기엔 애매하고, **ESA가 일반적인 반려동물 {"agent_id": "agent_3", "perspective": "건강·복지", "text": "여전히 저는 **집주인에게 알리는 쪽이 맞다**는 생각이지만, 다른 분들 말처럼 Jenna의 불안 진단과 ESA 추천서 가능성은 무시하면 안 된다고 봐요. 다만 핵심은 아직 **ESA 서류가 집주인에게 제출되지 않은 상태**이고, **반려동물 금지 조항이 있는 계약**에서 **허락 없이 개를 데려온 지 6주째**라는 점이에요. 게다가 이미 **낮에 짖어서 이웃 항의가 한 번 있었고**, 저도 **경미한 개털 알레르기**가 있어서 단순히 사적인 문제로만 넘기기 어렵습니다. 그래서 바로 감정적으로 신고하자는 건 아니지만, 먼저 Jenna와 한 번 더 이야기해 볼 수는 있어도, 결국 서류가 제대로 정리되지 않거나 소음과 생활 피해가 계속된다면 **집주인에게 알려 공식적으로 정리하는 게 더 책임 있는 선택**이라고 생각해요."}, {"agent_id": "agent_6", "perspective": "공동생활·관계", "text": "저는 여전히 **당장 집주인에게 신고하는 쪽은 아니고, 먼저 Jenna와 다시 얘기해보는 게 맞다**는 쪽에 가깝습니다. 처음엔 허락 없이 개를 들여온 점과 낮에 짖어서 이웃 항의가 있었다는 점 때문에 그냥 넘기기 어렵다고 생각했지만, 다른 분들 말처럼 Jenna가 불안 진단을 받았고 치료사에게서 ESA 추천서를 받았다고 주장하는 만큼 **일반적인 반려동물 금지 규정과는 다를 수 있다**는 점도 무시할 수 없어요. 물론 **ESA 서류가 아직 집주인에게 제출되지 않은 상태**라는 건 계속 찜찜하고, 저도 **경미한 개털 알레르기** 때문에 생활이 불편한 건 사실입니다. 그래서 저는 지금은 비밀로만 덮어두기보다 Jenna와 솔직하게 서류 진행 상황, 짖는 문제, 제 알레르기까지 포함해서 조정해보고, 그래도 해결이 안 되거나 계속 문제가 생기면 그때 집주인에게 공식적으로 알리는 방향이 더 적절하다고 봐요."}, {"agent_id": "agent_1", "perspective": "계약·재정", "text": "저는 여전히 **집주인에게 알리는 쪽**에 조금 더 기울어요. Jenna가 불안 진단이 있고 ESA 추천서를 받았다고 주장하며, ESA가 경우에 따라 반려동물 금지 조항의 예외가 될 수 있다는 점은 분명 무시하면 안 된다고 생각해요. 그래서 무조건 즉시 신고하는 건 성급할 수 있고, 먼저 Jenna와 다시 이야기해서 실제로 서류가 준비됐는지, 집주인에게 제출 가능한 상태인지 확인해보는 건 필요하다고 봅니다. 다만 현재처럼 **허락 없이 6주째 개가 있는 상태**, **서류가 아직 제출되지 않은 상태**, **낮에 짖어서 이웃 항의가 있었던 점**, 그리고 **제 경미한 개털 알레르기**까지 생각하면, 그냥 개인 문제로 덮어두기엔 부담이 커요. 그래서 저는 먼저 대화는 하되, 결국 문제가 정리되지 않으면 집주인에게 알려서 공식적으로 처리하는 게 더 현실적이고 책임 있는 선택이라고 생각합니다."}, {"agent_id": "agent_2", "perspective": "계약·재정", "text": "저는 지금도 **바로 집주인에게 신고하지 않는 쪽**에 더 가깝지만, 예전보다 조금은 더 조심스럽게 보게 됐어요. Jenna가 진단된 불안이 있고 치료사 추천서가 있다고 한 점, 그리고 **ESA라면 일반적인 반려동물 금지 조항의 예외가 될 수 있다**는 점은 여전히 무시할 수 없다고 생각합니다. 다만 **허락 없이 6주 전에 개를 데려온 것**, **낮에 짖어서 이웃 항의가 있었던 것**, 그리고 **ESA 서류가 아직 집주인에게 제출되지 않은 상태**라는 부분은 분명 불안해요. 저도 **경미한 개털 알레르기** 때문에 불편함이 있고, 그냥 아무 문제 없다고 보기는 어렵지만, 그렇다고 바로 신고해서 갈등이나 보증금 문제를 키우는 건 아직 너무 급하다고 느껴요. 그래서 제 생각은, 우선 Jenna와 다시 이야기해서 서류가 실제로 준비되는지, 짖는 문제를 줄일 수 있는지 확인해보고, 그 뒤에도 정리  **아직 집주인에게 서류가 제출되지 않았고**, **낮에 짖어서 이웃 항의가 한 번 있었고**, 저도 **경미한 개털 알레르기** 때문에 불편한 건 사실이라 그냥 넘어갈 수는 없습니다. 그래서 지금은 감정적으로 신고하기보다 서류가 실제로 정리될 수 있는지, 짖는 문제를 줄일 수 있는지 먼저 확인해보는 게 우선이라고 보고, 그래도 해결이 안 되거나 계속 문제가 반복되면 그때는 집주인에게 알려서 공식적으로 정리하는 쪽을 고민하겠습니다."}, {"agent_id": "agent_3", "perspective": "건강·복지", "text": "여전히 저는 **집주인에게 알리는 쪽이 맞다**는 생각이에요. 다른 분들 말처럼 Jenna의 불안 진단과 치료사 추천서, 그리고 ESA가 경우에 따라 일반적인 반려동물 금지 조항의 예외가 될 수 있다는 점은 분명 고려해야 한다고 봐요. 다만 지금은 **ESA 서류가 집주인에게 제출되지 않은 상태**이고, **반려동물 금지 조항이 있는 계약에서 허락 없이 6주째 개를 데려온 상황**이라 그냥 넘어가기엔 어렵습니다. 이미 **낮에 짖어서 이웃 항의가 한 번 있었고**, 저도 **경미한 개털 알레르기** 때문에 실제로 불편을 겪고 있어서, 이걸 단순한 사정으로만 볼 수는 없어요. 그래서 바로 공격적으로 신고하자는 건 아니지만, 먼저 Jenna와 한 번 더 이야기해 볼 수는 있어도, 그 뒤에도 서류가 정리되지 않거나 문제 행동과 생활 피해가 계속된다면 **집주인에게 알려 공식적으로 처리하는 게 더 책임 있는 선택**이라고 생각합니다."}, {"agent_id": "agent_6", "perspective": "공동생활·관계", "text": "저는 아직도 **바로 집주인에게 신고하기보다는 Jenna와 먼저 다시 이야기해보는 쪽**에 더 가깝습니다. 다른 분들 말처럼 **계약에 반려동물 금지 조항이 있고, 허락 없이 6주째 개가 있는 점, ESA 서류가 아직 제출되지 않은 점, 낮에 짖어서 이웃 항의가 한 번 있었던 점, 그리고 제 경미한 개털 알레르기**까지 생각하면 그냥 넘어갈 문제는 아니에요. 다만 Jenna가 불안 진단이 있고 치료사에게서 ESA 추천서를 받았다고 주장하는 만큼, 이걸 단순한 무단 반려동물로만 보고 바로 신고하는 건 아직 조금 성급하다고 느껴요. 그래서 제 생각은, 먼저 서류가 실제로 준비되는지와 짖는 문제를 줄일 방법이 있는지 분명히 확인해보고, 그 뒤에도 계속 정리가 안 되거나 생활에 불편이 이어지면 그때는 집주인에게 알리는 게 맞다는 쪽입니다."}, {"agent_id": "agent_1", "perspective": "계약·재정", "text": "저는 여전히 **집주인에게 알리는 쪽에 조금 더 기울어 있어요.** Jenna가 불안 진단이 있고 치료사에게서 ESA 추천서를 받았다고 주장하는 점, 그리고 ESA가 경우에 따라 반려동물 금지 조항의 예외가 될 수 있다는 점은 분명 고려해야 한다고 생각합니다. 그래서 바로 신고하는 건 성급할 수 있고, 우선 Jenna와 다시 이야기해서 서류가 실제로 준비됐는지, 짖는 문제를 줄일 수 있는지 확인해보는 건 필요하다고 봐요. 다만 **허락 없이 6주째 개가 있는 상태**, **아직 집주인에게 서류가 제출되지 않은 점**, **낮에 짖어서 이웃 항의가 이미 있었던 점**, 그리고 **제 경미한 개털 알레르기 때문에 실제로 불편이 생긴 점**까지 보면, 그냥 참고 넘기기엔 상황이 꽤 누적돼 있다고 느껴요. 그래서 제 생각엔 먼저 대화는 해보되, 그 뒤에도 정리가 안 되거나 문제가 계속되면 **집주인에게 알려 공식적으로 처리하는 쪽이 더 책임 있는 선택**입니다."}, {"agent_id": "agent_2", "perspective": "계약·재정", "text": "저는 지금도 **바로 집주인에게 신고하지 않는 쪽**에 더 가깝지만, 상황을 예전보다 조금 더 신중하게 보고 있어요. Jenna가 불안 진단이 있고 치료사 추천서가 있다고 주장하는 만큼, **ESA가 일반적인 반려동물 금지 조항의 예외가 될 수 있다**는 점 도 고려해야 해서, 무조건 신고하기보다는 먼저 룸메이트와 대화해서 해결하는 게 더 낫다고 생각합니다."}, {"agent_id": "agent_3", "perspective": "건강·복지", "text": "저라면 **네, 집주인에게 신고하는 게 맞다**고 생각해요.\n\nJenna는 **진단된 불안**이 있어서 상황을 더 조심해서 다뤄야 하고, **ESA 서류도 아직 집주인에게 제출되지 않은 상태**라서 공식적으로 보호받는 절차가 정리되지 않은 것 같아요. 동시에 저는 **경미한 개털 알레르기**가 있어서 이 문제를 그냥 넘기면 제 건강과 생활에도 영향이 있을 수 있어요.\n\n서로를 배려하려면 감정적으로만 참고 넘기기보다, **집주인에게 사실대로 알리고 해결책을 찾는 게 필요하다**고 봐요."}, {"agent_id": "agent_4", "perspective": "건강·복지", "text": "솔직히 저는 **아니라고 생각해요**. Jenna는 진단된 불안이 있고, 치료사에게서 **ESA 추천서**를 받았다고 했잖아요. 게다가 **비밀로 해달라고 부탁했다**면 그 부분은 더더욱 함부로 집주인에게 신고할 일은 아니라고 봐요. 이런 상황에서는 신고하기보다 먼저 Jenna와 직접 이야기해보고, 서로 불편하지 않게 조율할 방법을 찾는 게 맞다고 생각합니다."}, {"agent_id": "agent_5", "perspective": "공동생활·관계", "text": "솔직히 **집주인에게 신고해야 한다고 생각해요.**\n\n낮에 개가 짖어서 이미 이웃 항의가 한 차례 있었고, 저는 **경미한 개털 알레르기**도 있어서 그냥 넘기기엔 불편함이 있어요. 게다가 **Jenna가 비밀로 해달라고 부탁한 것**도 알고 있지만, 이런 문제는 숨기기보다 집주인에게 알려서 해결 방법을 찾는 게 맞다고 봅니다.\n\n서로에게 피해가 계속되기 전에 정리하는 게 좋을 것 같아요."}, {"agent_id": "agent_6", "perspective": "공동생활·관계", "text": "저는 **아니요, 집주인에게 신고하지 않는 게 좋겠다**고 생각해요.  \nJenna가 **6주 전 집주인 허락 없이 개를 데려왔고**, 그 개 때문에 **낮에 짖어서 이웃 항의가 한 차례 있었던 건 분명 문제**예요. 게다가 **Jenna가 비밀로 해달라고 부탁한 상황**이라 더 고민될 수밖에 없죠.\n\n하지만 저는 먼저 **Jenna와 직접 이야기해서 해결책을 찾는 것**이 우선이라고 봐요. 예를 들어 개 짖는 문제를 줄이거나, 집주인 허락 문제를 Jenna가 직접 정리하도록 말해볼 수 있겠죠. 바로 신고하기보다는, 관계를 크게 망치지 않으면서 문제를 해결할 기회를 주는 편이 낫다고 생각합니다."}, {"agent_id": "agent_7", "perspective": "법·규정", "text": "저는 **네, 집주인에게 신고해야 한다고 생각해요.**  \n\n임대차 계약에 **반려동물 금지 조항**이 있는데도, Jenna가 **6주 전 집주인 허락 없이 개를 데려왔고**, 게다가 **ESA 서류도 아직 집주인에게 제출되지 않은 상태**라면 이건 그냥 넘기기 어렵다고 봐요. 계약은 지켜야 하고, 처음부터 집주인과 공식적으로 확인했어야 한다고 생각합니다.  \n\n룸메이트 문제라서 조심스럽긴 하지만, 이런 경우에는 감정보다 **계약과 책임**이 더 중요하다고 봐요."}, {"agent_id": "agent_8", "perspective": "법·규정", "text": "저는 **아니요, 지금 당장 집주인에게 신고하는 건 좋지 않다**고 생각해요.  \nJenna가 치료사에게 **ESA 추천서**를 받았다고 주장하고 있고, **ESA는 법적으로 일반 반려동물 금지 조항의 예외가 될 수** 있어요. 게다가 **임대차 계약 갱신이 3주 뒤**라서, 지금 문제를 크게 만들기보다 우선 사실관계를 확인하고 차분하게 대응하는 게 더 낫다고 봅니다."}], "1": [{"agent_id": "agent_4", "perspective": "건강·복지", "text": "솔직히 저는 아직도 **바로 집주인에게 신고하는 건 아니라고 생각해요.** Jenna가 6주 전 허락 없이 개를 데려온 건 분명 문제이고, 낮에 짖어서 이웃 항의가 한 번 있었던 것도 신경 쓰이지만, Jenna가 **진단된 불안**이 있고 **치료사 추천서가 있는 ESA**라고 주장하는 이상 바로 계약 위반으로 단정하기는 어렵다고 봐요. 다른 분들처럼 계약 조항이나 갱신 시점이 중요하다는 점은 이해하지만, **ESA는 예외가 될 수 있다**는 점과 Jenna가 **비밀로 해달라고 부탁한 상황**도 무시하기 힘들어요. 게다가 저는 **경미한 개털 알레르기**가 있어서 불편한 건 사실이지만, 그렇다고 먼저 집주인부터 끌어들이기보다는 Jenna와 직접 이야기해서 짖는 문제나 서류 정리 문제를 먼저 해결해보는 게 더 바람직하다고 생각합니다. 만약 그 다음에도 계속 문제가 해결되지 않거나 제 건강과 생활에 실제로 더 큰 피해가 생기면 그때 다시 집주인에게 알리는 걸 고민할 것 같아요."}, {"agent_id": "agent_5", "perspective": "공동생활·관계", "text": "여전히 저는 **집주인에게 알리는 쪽**이 맞다고 생각해요. 물론 Jenna가 **진단된 불안**이 있고 **ESA 추천서**를 받았을 수 있다는 점, 그리고 ESA가 경우에 따라 예외가 될 수 있다는 말도 이해합니다. 하지만 지금 상황은 **반려동물 금지 조항이 있는 계약**을 이미 건드렸고, **6주 전 허락 없이 개를 데려왔는데 아직 공식적으로 정리되지 않은 상태**라서 그냥 덮어두기엔 불안해요. 게다가 **낮에 짖어서 이웃 항의가 한 번 있었고**, 저도 **개털 알레르기**가 있어서 실제로 생활에 영향이 있습니다. Jenna가 비밀로 해달라고 부탁한 건 존중하고 싶지만, 그 부탁만으로 제 불편함과 계약상의 문제를 무시할 수는 없다고 봐요. 그래서 저는 먼저 직접 말해볼 수는 있어도, 결국에는 **집주인에게 사실대로 알려서 공식적으로 해결하는 게 맞다**는 쪽입니다."}, {"agent_id": "agent_7", "perspective": "법·규정", "text": "저는 여전히 **집주인에게 알리는 쪽이 맞다**고 생각해요. Jenna가 진단된 불안이 있고 ESA 추천서를 받았다는 점, 그리고 비밀로 해달라고 한 사정은 이해하지만, **6주 전 허락 없이 개를 데려왔고** 이미 **낮에 짖어서 이웃 항의도 있었으며**, **ESA 서류도 집주인에게 아직 제출되지 않은 상태**라면 그냥 개인적으로 넘길 문제는 아니라고 봐요. 물론 ESA가 법적으로 예외가 될 수 있다는 의견도 일리가 있어서, 무작정 “신고해서 벌주자”는 식으로 가고 싶은 건 아니지만, 현재로선 **계약 조건과 집주인의 확인이 필요한 상황**이라고 생각해요. 그래서 저는 먼저 차분히 Jenna에게 이 문제를 말하고, 가능하면 그녀가 직접 정리하도록 하되, 해결이 안 되면 집주인에게 사실대로 알리는 게 가장 현실적이고 공정하다고 봅니다."}, {"agent_id": "agent_8", "perspective": "법·규정", "text": "저는 여전히 **지금 당장 집주인에게 신고하는 건 서두르는 선택**이라고 생각해요. Jenna가 **진단된 불안**이 있고 치료사에게서 **ESA 추천서**를 받았다고 했으며, 정말로 ESA라면 일반적인 반려동물 금지 조항과는 다르게 봐야 할 수 있다는 점은 무시하기 어렵습니다. 다만 다른 분들이 말한 것처럼 **낮에 짖어서 이웃 항의가 있었고**, **개털 알레르기**처럼 실제 불편도 있으니 그냥 참고 넘기자는 뜻은 아니에요. 제 생각엔 먼저 Jenna와 직접 이야기해서 **짖는 문제와 집주인에게 서류를 어떻게 정리할지**를 확인해보고, 정말로 해결이 안 되거나 거짓말이나 계약 위반이 명확해질 때 집주인에게 알리는 쪽이 더 균형 잡힌 대응입니다."}, {"agent_id": "agent_3", "perspective": "건강·복지", "text": "여전히 저는 **집주인에게 알리는 쪽이 맞다**고 생각해요. Jenna가 진단된 불안이 있고 ESA 추천서가 있다는 점은 이해하지만, **아직 ESA 서류를 집주인에게 제출하지 않았고**, 무엇보다 제가 **개털 알레르기**가 있어서 이 상황을 그냥 개인적으로만 넘기기엔 부담이 있어요. 다른 분들 말처럼 먼저 Jenna와 이야기해서 조율해보는 건 분명 필요하다고 보지만, 이미 **무허가로 데려온 기간이 있고 이웃 항의도 한 번 있었던 만큼** 더 늦추면 오히려 문제만 커질 수 있다고 생각합니다. 그래서 저는 무턱대고 고자질하는 느낌이라기보다, **집주인에게 사실을 공유하고 정식으로 정리하게 하는 게 결국 더 공정하고 안전한 선택**이라고 봐요."}, {"agent_id": "agent_6", "perspective": "공동생활·관계", "text": "저는 여전히 **지금 당장 집주인에게 신고하는 건 아니라고 생각해요**. Jenna가 허락 없이 개를 데려온 건 분명 문제이고, 낮에 짖어서 이웃 항의가 있었다는 점도 가볍게 볼 수는 없어요. 하지만 **ESA 추천서가 있다**는 점, 그리고 **임대차 계약 갱신이 3주 뒤**라는 점을 보면 먼저 사실관계를 좀 더 확인하고 조심스럽게 대응하는 게 맞아 보입니다. 무엇보다 Jenna가 **비밀로 해달라고 부탁한 상황**에서 곧바로 집주인에게 알리는 건 관계를 너무 크게 악화시킬 수 있어서, 우선은 Jenna와 직접 이야기해서 짖는 문제나 집주인과의 정리 방법을 스스로 해결하도록 요구해보는 게 낫다고 봐요. 다만 그 뒤에도 계속 무시되거나 문제가 반복되면 그때는 집주인에게 알리는 것도 고려할 수 있다고 생각합니다."}, {"agent_id": "agent_1", "perspective": "계약·재정", "text": "저는 여전히 **집주인에게 알리는 쪽**에 더 가깝습니다. 계약서에 **반려동물 금지 조항**이 있고, **6주 전 집주인 허락 없이 개를 데려온 것** 자체는 분명 문제라고 생각해요. 다만 다른 분들이 말한 것처럼 **Jenna가 진단된 불안이 있고 ESA 추천서가 있다면 예외 가능성**도 있어서, 무조건 감정적으로 신고하기보다 먼저 사실관계를 확인해보는 게 맞겠죠. 그래도 **아직 ESA 서류가 집주인에게 제출되지 않은 상태**이고, **낮에 짖어서 이웃 항의까지 나온 상황**이라면 그냥 묵인하기는 어렵습니다. 그래서 제 생각은, Jenna에게 먼저 직접 한 번 이야기하되, 해결이 안 되거나 공식 확인이 안 되면 결국 **집주인에게 알리는 것이 맞다**는 쪽입니다."}, {"agent_id": "agent_2", "perspective": "계약·재정", "text": "저는 여전히 **지금 바로 집주인에게 신고하는 쪽은 아니라고 봐요**. 계약 위반 시 보증금 500달러 몰수나 월 40달러 추가 비용 같은 부담이 있는 것도 크고, 무엇보다 Jenna가 진단된 불안이 있고 치료사에게 ESA 추천서를 받았다고 한 만큼 **ESA가 예외가 될 가능성**도 무시할 수 없다고 생각해요. 다만 다른 분들이 지적한 것처럼 낮에 짖어서 이웃 항의가 있었고, 제가 경미한 개털 알레르기도 있어서 그냥 방치할 문제는 아니라고 봅니다. 그래서 제 입장은 조금 더 분명히 하면, **즉시 신고보다는 먼저 Jenna와 직접 얘기해서 짖는 문제와 집주인에게 공식적으로 어떻게 정리할지 정하게 하고**, 그 후에도 해결이 안 되거나 계속 숨기려 한다면 그때 집주인에게 말하는 게 맞다는 쪽으로 정리됩니다."}], "2": [{"agent_id": "agent_4", "perspective": "건강·복지", "text": "솔직히 저는 여전히 **당장 집주인에게 신고하는 건 아니라고 생각해요.** Jenna가 6주 전 허락 없이 개를 데려온 건 분명 좋지 않았고, 낮에 짖어서 이웃 항의가 있었던 것도 가볍게 볼 일은 아니지만, 그래도 **진단된 불안**이 있고 **치료사 추천서가 있는 ESA**라고 한다면 완전히 일반적인 반려동물 위반처럼 단정하기는 어렵다고 봐요. 다른 분들이 말한 것처럼 계약서의 반려동물 금지 조항이나 아직 서류가 집주인에게 제출되지 않았다는 점은 분명 신경 쓰이지만, ESA가 예외가 될 수 있다는 가능성도 있어서 우선은 사실관계를 더 확인하는 게 맞다고 생각합니다. 무엇보다 Jenna가 **비밀로 해달라고 부탁한 상황**인 만큼, 바로 집주인을 끌어들이기보다는 먼저 Jenna와 차분히 이야기해서 짖는 문제와 집주인에게 어떻게 정리할지 스스로 해결하도록 하는 게 더 공정해 보여요. 물론 제 **경미한 개털 알레르기** 때문에 불편은 있고, 그 부분은 더 이상 참기만 할 문제는 아니라고 보지만, 지금으로선 **직접 대화 → 해결 안 되면 그때 집주인** 순서가 가장 균형 잡힌 대응이라고 생각합니다."}, {"agent_id": "agent_5", "perspective": "공동생활·관계", "text": "여전히 저는 **집주인에게 알리는 쪽이 맞다**는 입장이에요. Jenna가 **진단된 불안**이 있고 **ESA 추천서**가 있을 수 있다는 점, 그리고 ESA가 어떤 경우엔 예외가 될 수 있다는 부분도 충분히 이해합니다. 다만 지금은 **반려동물 금지 조항이 있는 계약**이 걸려 있고, **허락 없이 개를 데려온 지 6주가 지났는데도 공식적으로 정리되지 않았으며**, 이미 **낮에 짖어서 이웃 항의까지 한 번 나온 상황**이라 그냥 개인적으로만 해결하자고 하기엔 문제가 꽤 커 보입니다. 저도 **개털 알레르기**가 있어서 단순히 예민한 문제가 아니라 실제 생활에 영향이 있고요. 물론 Jenna가 비밀로 해달라고 한 건 최대한 존중하고 싶지만, 그걸 이유로 계속 덮어두는 건 아니라고 생각해요. 가능하면 먼저 Jenna에게 직접 한 번 더 얘기해볼 수는 있겠지만, 결국에는 **집주인에게 사실대로 알려서 계약과 거주 문제를 공식적으로 정리하는 게 맞다**고 봅니다."}, {"agent_id": "agent_7", "perspective": "법·규정", "text": "저는 지금도 기본적으로 **집주인에게 알리는 쪽이 맞다**고 생각해요. Jenna가 진단된 불안이 있고 ESA 추천서가 있을 수 있다는 점, 그리고 비밀로 해달라고 한 사정도 이해하지만, **허락 없이 개를 데려온 지 6주가 지났고**, 이미 **낮에 짖어서 이웃 항의가 한 번 있었으며**, **아직 집주인에게 공식 서류도 제출되지 않은 상태**라면 더 이상 단순한 개인 간 문제로만 보긴 어렵다고 봐요. 다만 다른 분들 말처럼 ESA가 예외가 될 가능성도 있고, 바로 “신고”부터 하자는 건 너무 강한 대응일 수 있으니, 먼저 Jenna에게 차분하게 문제를 얘기하고 스스로 정리할 기회를 주는 건 필요하다고 생각합니다. 그래도 그 뒤에도 명확한 해결이 없거나 계속 숨기려 한다면, 저는 결국 **집주인에게 사실대로 알리고 공식적으로 처리하는 게 가장 공정하고 현실적**이라고 봐요."}, {"agent_id": "agent_8", "perspective": "법·규정", "text": "저는 아직도 **바로 집주인에게 신고하는 건 조금 성급하다**는 쪽에 가까워요. Jenna가 **6주 전 허락 없이 개를 데려온 건 분명 문제**이고, **낮에 짖어서 이웃 항의가 있었던 점**이나 제가 가진 **개털 알레르기**도 가볍게 볼 일은 아니라고 생각합니다. 그래도 Jenna가 **진단된 불안**이 있고 **치료사 추천서가 있는 ESA**라고 주장하는 이상, 단순한 반려동물 무단 반입처럼만 보고 즉시 집주인에게 넘기기보다는 먼저 사실관계를 더 확인하는 게 맞아 보여요. 특히 ESA라면 예외가 될 가능성도 있고, 아직 **서류가 집주인에게 정리되지 않은 상태**라면 Jenna와 먼저 직접 이야기해서 짖는 문제와 공식 처리 방법을 요구해보는 게 우선이라고 봅니다. 다만 그 뒤에도 Jenna가 계속 숨기거나 문제가 반복되고, 제 생활이나 건강에 실제 피해가 커진다면 그때는 집주인에게 알리는 것도 충분히 고려할 수 있다고 생각해요."}, {"agent_id": "agent_3", "perspective": "건강·복지", "text": "여전히 저는 **집주인에게 알리는 쪽이 맞다**는 입장이에요. 다른 분들처럼 Jenna의 **진단된 불안**이나 **ESA 추천서**가 있을 수 있다는 점은 충분히 이해하고, 정말 ESA라면 일반 반려동물 금지와 다르게 볼 여지도 있다는 건 인정합니다. 그렇다고 해도 **허락 없이 6주 전 데려온 뒤 아직 공식 서류가 집주인에게 제출되지 않았고**, 이미 **낮에 짖어서 이웃 항의까지 있었으며**, 저도 **개털 알레르기**가 있어서 그냥 넘어가기에는 생활에 영향이 있어요. Jenna와 먼저 차분히 이야기해보는 건 당연히 필요하지만, 그걸로만 끝내기엔 상황이 꽤 오래 갔고 문제도 이미 드러났다고 봅니다. 그래서 제 생각은, 감정적으로 “신고”한다기보다 **집주인에게 사실을 공유해서 공식적으로 확인하고 정리하게 하는 게 더 공정하고 안전하다**는 쪽입니다."}, {"agent_id": "agent_6", "perspective": "공동생활·관계", "text": "저는 아직도 **바로 집주인에게 신고하는 쪽은 아니라고 생각해요**. Jenna가 허락 없이 개를 데려온 건 분명 잘못이고, 낮에 짖어서 이웃 항의가 있었던 것도 그냥 넘길 일은 아니지만, **ESA 추천서가 있다는 주장**과 **임대차 계약 갱신이 3주 뒤라는 점**을 보면 지금은 감정적으로 바로 신고하기보다 상황을 더 정확히 확인하는 게 우선이라고 봐요. 다른 분들처럼 계약 문제나 제 알레르기, 불편함을 이해하긴 하지만, 아직은 Jenna가 **비밀로 해달라고 부탁한 상태**이기도 해서 곧장 집주인에게 알리면 관계만 더 크게 깨질 수 있다고 생각합니다. 그래서 제 입장은 먼저 Jenna에게 직접 이야기해서 짖는 문제와 서류 정리를 스스로 해결하라고 요구해보고, 그 뒤에도 계속 숨기거나 문제가 반복되면 그때 집주인에게 알리는 쪽으로 가는 게 가장 균형 잡힌 대응 같아요."}, {"agent_id": "agent_1", "perspective": "계약·재정", "text": "저는 여전히 **집주인에게 알리는 쪽에 더 가깝다**고 생각해요. Jenna가 진단된 불안이 있고 ESA 추천서가 있다면 예외 가능성을 고려해야 한다는 점은 이해하지만, **6주 전에 허락 없이 개를 데려온 것**, **반려동물 금지 조항이 있는 계약**, 그리고 **낮에 짖어서 이웃 항의가 있었던 사실**은 그냥 넘어가기 어렵습니다. 물론 바로 고자질하듯 신고하기보다는 먼저 Jenna에게 직접 말해보고, ESA 서류나 집주인과의 정리 방법을 스스로 해결할 기회를 주는 게 맞다고 봐요. 하지만 지금처럼 **공식적으로 정리되지 않은 상태**가 계속되고 있고 저도 **개털 알레르기**로 실제 불편이 있는 만큼, 해결이 지지부진하면 결국 **집주인에게 사실대로 알려서 정식으로 처리하는 게 더 공정하고 현실적**이라고 생각합니다."}, {"agent_id": "agent_2", "perspective": "계약·재정", "text": "저는 여전히 **지금 바로 집주인에게 신고하는 건 아니라고 봐요**, 다만 그냥 넘어가자는 뜻도 아닙니다. Jenna가 허락 없이 6주 전 개를 데려왔고 낮에 짖어서 이웃 항의까지 있었던 건 분명 신경 쓰이지만, 한편으로는 **진단된 불안**이 있고 **치료사 추천서가 있는 ESA일 수 있다**는 점도 있어서 곧바로 계약 위반으로 단정하기는 어렵다고 생각해요. 게다가 계약 위반으로 보증금 몰수나 추가 비용 같은 현실적인 부담도 있고, 제가 경미한 개털 알레르기가 있어서 불편한 건 사실이지만, 그래도 먼저 집주인을 끌어들이기보다는 **Jenna와 직접 이야기해서 짖는 문제와 ESA 서류를 어떻게 공식적으로 정리할지** 확인해보는 게 우선이라고 봅니다. 다만 그 이후에도 계속 무시되거나 해결이 안 되고, 제가 사는 데 실제로 피해가 커진다면 그때는 집주인에게 알리는 쪽을 다시 생각할 것 같아요."}], "3": [{"agent_id": "agent_4", "perspective": "건강·복지", "text": "솔직히 저는 아직도 **당장 집주인에게 신고하는 건 조금 이르다**는 쪽에 더 가깝습니다. Je function catalogHtml(rs,provs){const rows=rs.map(r=>{const p=provs[`${r.issue_id}/${r.run_id}`]||{},h=p.health||{},pv=p.provenance||{},ok=h.baseline_eligible===true,condition=r.condition??r.settings?.ledger_mode??'—',parse=pv.judge_health?.n_parse_fail??'미계측',issues=(h.issues||[]).map(esc).join('<br>');return `<tr><td>${esc(r.run_id)}</td><td>${esc(r.issue_id)}</td><td>${esc(condition)}</td><td>${esc(r.judge??'—')}</td><td>${esc(r.n_stages??'—')}</td><td>${pct(r.far_system)}</td><td class="${ok?'eligible':'ineligible'}">${ok?'자격 있음':'자격 없음'}${issues?`<div class="meta">${issues}</div>`:''}</td><td>${esc(h.blank_utterances??'—')}</td><td>${esc(parse)}</td></tr>`}).join('');return `<details id="run-catalog" ${rs.length===1?'open':''}><summary>판 목록 ${rs.length}개</summary><table class="catalog"><tr><th>run_id</th><th>issue_id</th><th>조건</th><th>판정기</th><th>라운드 수</th><th>FAR</th><th>자격</th><th>공백 발화</th><th>판정 파싱실패</th></tr>${rows}</table></details>`}
async function provenanceMap(rs){const pairs=await Promise.all(rs.map(async r=>{const key=`${r.issue_id}/${r.run_id}`,res=await fetch(`/api/provenance/${key}`);return [key,res.ok?await res.json():{}]}));return Object.fromEntries(pairs)}
async function boot(){if(BAKED){D=BAKED;const c=BAKED_CATALOG||{runs:D.records.map(r=>({issue_id:D.issue_id,run_id:r.run_id})),provenance:{}};document.getElementById('catalog').innerHTML=catalogHtml(c.runs,c.provenance||{});document.querySelector("header select#a").innerHTML=`<option>${esc(D.records[0].run_id)}</option>`;document.querySelector("header select#b").innerHTML=`<option>${esc(D.records[1].run_id)}</option>`;document.getElementById("go").disabled=true;render();return}const x=await(await fetch('/api/runs')).json(),all=x.runs||[],provs=await provenanceMap(all);document.getElementById('catalog').innerHTML=catalogHtml(all,provs);if(all.length===1){document.getElementById('main').innerHTML='<div class="panel">판이 하나뿐이라 나란히 놓을 수 없다. 대조·전기에서 이 판을 볼 수 있다.</div>';document.getElementById('a').disabled=true;document.getElementById('b').disabled=true;document.getElementById('go').disabled=true;return}const rs=all.filter(r=>r.parts?.judgment==='present');for(const id of ['a','b'])document.getElementById(id).innerHTML=rs.map(r=>`<option value="${esc(r.issue_id+'/'+r.run_id)}">${esc(r.issue_id+' / '+r.run_id)}</option>`).join('');if(rs.length<2){document.getElementById('main').innerHTML='<div class="panel">채점까지 끝난 판이 둘보다 적어 나란히 놓을 수 없습니다.</div>';return}const present=rs.find(r=>r.parts?.recalls==='present'),absent=present?[...rs].reverse().find(r=>r.issue_id===present.issue_id&&r.parts?.recalls==='absent'):null;if(absent&&present){document.getElementById('a').value=absent.issue_id+'/'+absent.run_id;document.getElementById('b').value=present.issue_id+'/'+present.run_id}else document.getElementById('b').selectedIndex=1;document.getElementById('go').onclick=load;load()}
async function load(){const av=document.getElementById('a').value,bv=document.getElementById('b').value;const [issue,a]=av.split('/'),[ib,b]=bv.split('/');if(issue!==ib){document.getElementById('main').innerHTML='<div class="banner bad">같은 이슈의 두 판을 고르세요.</div>';return}if(a===b){document.getElementById('main').innerHTML='<div class="banner bad">서로 다른 두 판을 고르세요.</div>';return}const g=await fetch(`/api/pair/${issue}/${a}/${b}`);if(!g.ok){document.getElementById('main').innerHTML=`<div class="banner bad">${esc((await g.json()).detail)}</div>`;return}D=await g.json();SEL=D.divergences[0]?[D.divergences[0].fact_id,D.divergences[0].stage]:null;render()}
function statusBanner(){const rows=D.records.map(r=>`${esc(r.run_id)} · 장부 ${r.ledger_mode==='off'?'끔':`켬(${esc(r.ledger_mode)})`} · 판정기 ${esc((r.judge||{}).model||'?')}`).join('<br>');const counts=D.records.map(r=>`${esc(r.run_id)} 팩트 ${r.facts.length}개 · 라운드 ${new Set(r.cells.map(c=>c.stage)).size}개`).join(' / ');return `<div class="banner"><b>데이터 뿌리</b> ${esc(D.data_root)}<br>${rows}<br>${counts}<br>이 화면은 두 판의 값을 나란히 놓기만 한다. 두 판이 무엇만 다른지는 로그에 적힌 값(위)으로 사람이 판단한다.</div>`}
function curve(){const ts=D.timeline,vals=ts.flatMap(x=>Object.values(x.runs).map(y=>Number(y.far))).filter(Number.isFinite),max=Math.max(.01,...vals);const X=i=>45+i*(700/Math.max(1,ts.length-1)),Y=v=>185-Number(v)/max*145;let g='<line class="axis" x1="45" y1="185" x2="745" y2="185"/>';D.records.forEach((r,k)=>{const pts=ts.map((t,i)=>`${X(i)},${Y(t.runs[r.run_id].far)}`).join(' ');g+=`<polyline class="l${k?'b':'a'}" points="${pts}"/>`;ts.forEach((t,i)=>g+=`<circle class="dot-${k?'b':'a'}" cx="${X(i)}" cy="${Y(t.runs[r.run_id].far)}" r="4"><title>${esc(r.run_id)} r${t.stage} ${pct(t.runs[r.run_id].far)}</title></circle><text x="${X(i)}" y="205" fill="var(--dim)" text-anchor="middle" font-size="11">r${t.stage}</text>`) });return `<svg viewBox="0 0 780 220" role="img" aria-label="라운드별 FAR 두 곡선">${g}</svg>`}
function finalCards(){const last=stages().at(-1);return `<div class="cards">`+D.records.map((r,k)=>{const lost=r.cells.filter(c=>c.stage===last&&!c.surviving).map(c=>c.fact_id);const hz=(r.analysis.transitions||[]).find(x=>x.to_stage===last)?.cond_attrition;return `<div class="card"><b class="${k?'b':'a'}">${esc(r.run_id)}</b><div class="num">${pct(r.far.final)}</div><div class="meta">마지막 FAR · 중요 ${pct(r.far.final_critical)}</div><div>소실 ${lost.length}건: ${lost.map(x=>esc(x.replace(/^fact_/,''))).join(' · ')||'없음'}</div><div class="meta">마지막 전이 조건부 hazard ${pct(hz)}</div></div>`}).join('')+`</div>`}
function evidenceText(x){const labels=[['literal','원문 대조'],['judged','판정 매개'],['mixed','혼재'],['undefined','정의 밖']],parts=labels.filter(([key])=>x?.[key]!=null&&Number(x[key])!==0).map(([key,label])=>`${label} ${x[key]}`);return parts.join(' · ')||'없음'}
function judgeText(x){return `${esc(x?.model||'?')} · 온도 ${esc(x?.temperature)} · 표 ${esc(x?.n_votes)} · 합산 ${esc(x?.aggregation)}`}
function judgeTitle(x){return `prompt_ver ${x?.prompt_ver??'—'} · note ${x?.note??'—'}`}
function seatState(c,id){const counted=c.counted.includes(id),access=c.access_agents.includes(id);return counted?(access?'counted':'unaccounted'):(access?'access':'none')}
function seatDots(r,c,k){const K=D.shape.n_agents[r.run_id],order=r.topology.order.slice(0,K);return `<div class="seats">${order.map(id=>{const state=seatState(c,id);if(state==='none')return `<span class="seat none" title="${esc(id)}">·</span>`;if(state==='unaccounted')return `<span class="seat unaccounted" title="${esc(id)}">!</span>`;return `<span class="seat ${state} ${k?'b':'a'}" title="${esc(id)}"></span>`}).join('')}</div>`}
function runMapHead(r,k){return `<th class="${k?'b':'a'}">${esc(r.run_id)}</th>`}
function pairDifferences(){const [a,b]=D.records,rows=[['장부',a.ledger_mode,b.ledger_mode],['판정기',(a.judge||{}).model,(b.judge||{}).model],['연결 모양',a.topology.structure,b.topology.structure],['창 원천',a.evidence.window_source,b.evidence.window_source],['참가자 수',D.shape.n_agents[a.run_id],D.shape.n_agents[b.run_id]],['라운드 수',new Set(a.cells.map(c=>c.stage)).size,new Set(b.cells.map(c=>c.stage)).size]],diffs=rows.filter(([,x,y])=>x!==y).map(([label,x,y])=>`${label} ${x} ↔ ${y}`);return `로그에 적힌 값 중 서로 다른 것: ${diffs.join(' · ')||'없음'}`}
function mapMeta(){return `<div class="mapmeta">${D.records.map((r,k)=>{const assumed=r.topology.assumed_full?' · 좌석 기록이 없어 전원 연결로 가정':'';return `<span><b class="${k?'b':'a'}">${esc(r.run_id)}</b> · 연결 모양 ${esc(r.topology.structure)}${assumed} · 창 원천 ${esc(r.evidence.window_source)} · 근거 구성 ${esc(evidenceText(r.evidence.evidence_mix))} · 판정 의존 ${esc(r.evidence.judged_share)}</span>`}).join('')}</div><div class="meta">${esc(pairDifferences())}</div>`}
function map(){const ss=stages(),facts=D.records[0].facts;let h=mapMeta()+'<table><tr><th rowspan="2">팩트</th>'+ss.map(s=>`<th colspan="2">r${s}</th>`).join('')+'</tr><tr>'+ss.map(()=>D.records.map((r,k)=>runMapHead(r,k)).join('')).join('')+'</tr>';for(const f of facts){h+=`<tr><td class="fact">${f.critical?'★ ':''}${esc(f.fact_id)}<div class="meta">${esc((f.text||'').slice(0,44))}</div></td>`;for(const s of ss)for(const [k,r] of D.records.entries()){const c=cell(r,f.fact_id,s),div=D.divergences.some(x=>x.fact_id===f.fact_id&&x.stage===s),inj=r.injections.some(i=>i.round===s&&i.fact_ids.includes(f.fact_id)),K=D.shape.n_agents[r.run_id],unaccounted=c.counted.filter(id=>!c.access_agents.includes(id)),extra=unaccounted.length?` · 입력 목록엔 없는데 센 사람 ${unaccounted.length}명`:'';h+=`<td class="mapcell ${div?'div':''}" onclick="pick('${esc(f.fact_id)}',${s})" title="센 화자 ${c.counted.length}명 · 입력에 있던 사람 ${c.access_agents.length}명 · 참가자 ${K}명 · 근거 ${esc(c.evidence)} · 원문 확정 접근 ${esc(c.n_access_literal)}명${extra}">${seatDots(r,c,k)}${inj?'<span class="mark">↥</span>':''}</td>`}h+='</tr>'}const empty=D.divergences.length?'':'<div class="panel">이 두 판에서 갈린 칸은 없다 — 지도는 두 판이 같은 자리에서 같은 판정을 받았음을 보여준다(재현성 관측).</div>';return empty+h+'</table><div class="meta">● 판정기가 "말했다"고 센 자리 · ○ 입력엔 있었으나 센 명단에 없는 자리 · · 그 라운드 입력에 없던 자리<br>! 말했다고 셌는데 입력 목록엔 없던 자리<br>조립 기록 = 그 사람이 본 것이 로그에 남아 있다 · 재구성 = 이웃 발화 언급으로 되짚었다 · 혼재 = 섞였다<br>↥ = 주입이 닿은 칸 · 보라 테두리 = 두 판이 갈린 칸. 칸을 누르면 ④로 갑니다.</div>'}
function decomposition(){if(!D.fact_rows.length)return '<div class="panel">갈린 칸이 없다 — 이 두 판은 모든 칸에서 같은 판정을 받았다.</div>';const rows=D.fact_rows.map(x=>{const runs=Object.entries(x.runs).map(([id,r])=>{const rounds=r.intervention_rounds.length?r.intervention_rounds.map(s=>`r${s}`).join(' · '):'없음',first=r.first_divergence;return `<div class="meta">${esc(id)}: 마지막 r${x.final_stage} ${r.final.surviving?'생존':'소실'} · 다시 넣은 라운드 ${rounds} · 처음 갈린 칸 플래그 ${esc(first.flags.join(', ')||'없음')} · 근접도 ${first.max_prox} (${esc(first.max_prox_agent)})</div>`}).join('');return `<div class="panel gaprow"><a class="coord" onclick="pick('${esc(x.fact_id)}',${x.first_divergence_stage})">${esc(x.fact_id)} · 처음 갈린 라운드 r${x.first_divergence_stage} · 갈린 칸 ${x.divergent_stages.length}개</a>${runs}</div>`}).join('');return rows+'<div class="meta">이 절은 좌표만 적는다 — 왜 갈렸는지는 ④의 발화 전문을 사람이 읽고 정한다.</div>'}
function topologyGraph(r,c,k){const order=r.topology.order,K=order.length,pos={};order.forEach((id,i)=>{const a=2*Math.PI*i/Math.max(1,K)-Math.PI/2;pos[id]=[150+Math.cos(a)*95,90+Math.sin(a)*64]});let g='';if(r.topology.structure!=='full'){const seen=new Set();for(const [a,bs] of Object.entries(r.topology.edges))for(const b of bs){const key=[a,b].sort().join('\u0000');if(seen.has(key)||!pos[a]||!pos[b])continue;seen.add(key);g+=`<line class="edge" x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}"/>`}}for(const id of order){const [x,y]=pos[id],state=seatState(c,id),cls=state==='counted'?`node-counted-${k?'b':'a'}`:state==='access'?`node-access-${k?'b':'a'}`:state==='unaccounted'?'node-unaccounted':'node-none';g+=`<circle class="${cls}" cx="${x}" cy="${y}" r="8"><title>${esc(id)}</title></circle>${state==='unaccounted'?`<text class="node-alert" x="${x}" y="${y+4}">!</text>`:''}<text class="node-label" x="${x}" y="${y+20}">${esc(id)}</text>`}return `<svg class="neighbor" viewBox="0 0 300 180" role="img" aria-label="${esc(r.run_id)} 연결 그림">${g}</svg><div class="meta">${r.topology.structure==='full'?'전원 연결':`연결 모양 ${esc(r.topology.structure)}`}</div>`}
function detail(){if(!SEL)return '<div class="panel">갈린 칸을 고르세요.</div>';const [fid,s]=SEL,f=D.records[0].facts.find(x=>x.fact_id===fid);let h=`<div class="panel"><b>${esc(fid)} · r${s}</b><br>${esc(f?.text||'')}<div class="meta">근접도는 지표가 아니라 시선 유도입니다. ⚠ 팔 간 근접도 직접 비교 금지 — 장부 원문 주입이 발화를 원문 쪽으로 리셋합니다.</div></div><div class="two">`;for(const [k,r] of D.records.entries()){const c=cell(r,fid,s),us=r.utterances[String(s)]||[],inj=r.injections.find(i=>i.round===s&&i.fact_ids.includes(fid));h+=`<div><div class="runhead ${k?'b':'a'}">${esc(r.run_id)} · ${esc(c.status)} · 표 ${esc(c.votes.split||'-')} · 센 화자 ${c.counted.length}</div>${topologyGraph(r,c,k)}${us.map(u=>`<div class="utt ${c.counted.includes(u.agent_id)?'counted':''}"><div class="meta">${esc(u.agent_id)} · ${c.counted.includes(u.agent_id)?'센 발화':'안 셈'} · 근접도 ${c.prox[u.agent_id]??0}</div>${esc(u.text)}</div>`).join('')}${inj?`<details open><summary>이 칸의 주입 블록 원문 (${esc(inj.block_text_source)})</summary><pre>${esc(inj.block_text)}</pre></details>`:''}</div>`}return h+'</div>'}
function deps(){return `<div class="two">`+D.records.map((r,k)=>{const x=D.dependencies.runs[r.run_id];return `<div class="panel"><b class="${k?'b':'a'}">${esc(r.run_id)}</b><br>근거 구성 ${esc(evidenceText(x.evidence_mix))}<br>판정 의존 ${esc(x.judged_share)} · 표 갈린 칸 ${x.split_cells} · resurgence ${esc(x.resurgence_rate)}<br><span class="meta" title="${esc(judgeTitle(x.judge))}">판정기 ${judgeText(x.judge)}</span></div>`}).join('')+`</div>`}
function pick(f,s){SEL=[f,s];render();document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
function render(){document.getElementById('main').innerHTML=statusBanner()+`<h2>① 숫자 — 판정물에서 옮긴 FAR</h2>${curve()}${finalCards()}<div class="meta">전체 FAR은 아직 등장 전 팩트도 소실로 세므로 조건부 hazard를 함께 봅니다.</div><h2>② 확산 지도</h2>${map()}<h2>③ 격차 분해</h2>${decomposition()}<h2 id="detail">④ 발화 전문 대조</h2>${detail()}<h2>⑤ 무엇에 기대고 있나</h2>${deps()}`}
boot();
</script></body></html>
