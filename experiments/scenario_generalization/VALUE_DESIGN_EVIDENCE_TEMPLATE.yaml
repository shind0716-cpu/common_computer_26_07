# 가치관 설계 근거 템플릿
# 사용법: 이 파일을 카테고리별로 복사한 뒤 [입력: ...] 부분을 교체합니다.
# 하나의 카테고리에 여러 가치관을 넣으려면 values 항목을 복제합니다.

schema: value_design_evidence_v1
status: development_draft

category:
  id: "[입력: 영문 소문자 ID, 예: care_harm]"
  name: "[입력: 카테고리명, 예: 돌봄·피해]"
  definition: "[입력: 이 카테고리가 다루는 공통 도덕적 질문]"
  inclusion_rule: "[입력: 이 카테고리에 포함되는 판단 기준]"
  exclusion_rule: "[입력: 비슷하지만 다른 카테고리로 분리할 기준]"

values:
  - id: "[입력: 가치관 ID, 예: autonomy_respecting_care]"
    name: "[입력: 가치관명, 예: 자율 존중형 돌봄]"

    # 에이전트에게 제시할 수 있는 가장 짧은 가치 명제
    core_claim: "[입력: 무엇을 가장 중요하게 여기는지 한 문장]"

    meaning:
      definition: "[입력: 이 가치관의 의미]"
      protected_subject: "[입력: 누구 또는 무엇을 우선 보호하는가]"
      moral_priority: "[입력: 충돌 시 우선하는 원칙]"
      acceptable_cost: "[입력: 이 원칙을 위해 감수할 수 있는 비용]"
      limit_condition: "[입력: 이 가치관도 양보해야 하는 경계 조건]"
      not_the_same_as:
        - "[입력: 혼동하기 쉬운 가치관 또는 단순 입장]"

    evidence_basis:
      # 근거가 없으면 빈칸을 추정으로 채우지 말고 status를 pending으로 둡니다.
      - evidence_id: "EV-001"
        source_type: "[입력: 이론/논문/정본 시나리오/인터뷰/기타]"
        citation_or_source: "[입력: 서지정보, URL 또는 저장소 경로]"
        evidence_span: "[입력: 페이지·절·문장·fact_id 등 정확한 위치]"
        verified_claim: "[입력: 출처가 직접 뒷받침하는 주장]"
        inference_to_value: "[입력: 그 주장이 이 가치관 설계를 지지하는 이유]"
        strength: "[입력: direct/supporting/contextual]"
        status: "[입력: verified/pending/rejected]"
        counterevidence_or_limit: "[입력: 반대 근거, 적용 한계 또는 없음]"

    scenario_fit:
      - scenario_id: "[입력: 시나리오 ID]"
        decision_question: "[입력: 시나리오의 결정 질문]"
        relevant_facts:
          - "[입력: fact_id 또는 구체적 사실]"
        value_reasoning: "[입력: 사실에서 가치 판단으로 이어지는 추론]"
        can_support:
          - "[입력: 이 가치관이 지지할 수 있는 선택]"
        can_oppose:
          - "[입력: 같은 가치관이 조건에 따라 반대할 수 있는 선택]"
        stance_locked: false
        confounds:
          - "[입력: 다른 가치관·사전지식·문면 효과와의 혼입 가능성]"

    agent_profile:
      short_prompt: "[입력: 1~2문장의 가치관 제시문]"
      reasoning_rules:
        - "[입력: 판단할 때 먼저 확인할 요소]"
        - "[입력: 가치 충돌을 조정하는 방식]"
      prohibited_shortcuts:
        - "특정 찬성·반대 입장을 가치관과 일대일로 고정하지 않는다."
        - "시나리오에 없는 사실을 근거로 만들지 않는다."
        - "다른 가치관을 무조건 열등하거나 비도덕적으로 묘사하지 않는다."

    differentiation:
      nearest_competing_value: "[입력: 가장 가까운 다른 가치관]"
      shared_ground: "[입력: 두 가치관이 공통으로 중시하는 것]"
      decisive_difference: "[입력: 동일 사실에서 판단이 갈리는 핵심 기준]"
      discriminating_case: "[입력: 차이가 가장 선명하게 드러나는 사례]"

    falsification_and_review:
      disconfirming_observation: "[입력: 무엇이 관찰되면 설계가 실패한 것으로 볼지]"
      ambiguity_to_review: "[입력: 사람 검토가 필요한 애매한 지점]"
      reviewer: "[입력: 담당자 또는 미정]"
      review_status: "[입력: not_reviewed/reviewed/revise]"

provenance:
  author: "[입력: 작성자 또는 내부 ID]"
  created_at: "[입력: YYYY-MM-DD]"
  source_material_version: "[입력: 근거 자료 버전 또는 커밋]"
  notes: "[입력: 개발용 메모]"

governance:
  intended_use: development_only
  confirmatory_use_allowed: false
  requirements_before_confirmatory_use:
    - "근거 출처와 evidence_span 검증"
    - "카테고리 경계 및 경쟁 가치관 검토"
    - "가치관과 찬반 입장이 고정되지 않는지 대조 사례 확인"
    - "필요한 독립 검토와 승인"
