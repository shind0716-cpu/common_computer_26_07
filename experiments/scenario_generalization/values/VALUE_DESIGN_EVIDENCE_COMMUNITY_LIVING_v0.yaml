schema: value_design_evidence_v1
status: development_draft
category:
  id: community_living
  name: 공동체적 생활
  definition: 상충하는 정당한 필요가 공동생활의 제한된 공간·시간·안전·휴식 조건에서 충돌할 때, 어느 한쪽을 절대화하지 않고 최소 보호선·협의 영역·과도한 부담 전가의 경계를 어떻게 정할 것인가.
  inclusion_rule: 공동주택 또는 공동자원의 반복 사용에서 생활권, 휴식, 접근, 취약성, 상호 조정이 충돌하는 사례를 포함한다.
  exclusion_rule: 전문 법률·의학 판정이 핵심인 사례, 한쪽의 명백한 악의나 범죄가 답을 결정하는 사례, 희소자원의 거시 정책 배분이 주된 사례는 제외한다.
values:
- id: legitimate_boundary_setting
  name: 정당한 경계 설정
  core_claim: 서로의 필요가 모두 정당할 수 있음을 인정하되, 최소 보호선과 협의 가능한 영역, 과도한 부담 전가의 선을 구분한다.
  meaning:
    definition: 공동생활의 충돌을 전면 허용 또는 전면 금지로 단순화하지 않고, 침해하면 안 되는 최소선과 조정 가능한 범위를 구별하는 가치관이다.
    protected_subject: 양쪽 당사자의 기본 생활과 회복하기 어려운 피해를 피할 최소 보호선
    moral_priority: 최소 보호선, 협의 영역, 과도한 부담 전가의 경계를 사실 조건에 따라 구분한다.
    acceptable_cost: 협의 가능한 범위에서 시간·방식·공간을 제한하고 조정하는 비용
    limit_condition: 한쪽 선택이 회복하기 어려운 중대한 피해를 만들거나 현실적 대안이 없을 때 경계를 재조정한다.
    not_the_same_as:
    - 모든 요구를 똑같이 절반씩 수용하는 기계적 절충
    - 한쪽 필요를 언제나 우선하는 절대적 금지 또는 허용
  evidence_basis:
  - evidence_id: CL-V1-EV-001
    source_type: 사용자 승인 설계 입력
    citation_or_source: 2026-08-24 사용자 승인 입력
    evidence_span: 가치관 공통 세트 V1 전문
    verified_claim: ''
    inference_to_value: 외부 이론 근거 검증 전 사용자가 승인한 개발용 가치 정의를 그대로 기록했다.
    strength: contextual
    status: pending
    counterevidence_or_limit: 외부 이론 근거와 적용 타당성은 아직 검토되지 않았다.
  scenario_fit:
  - scenario_id: apartment_quiet_hours
    decision_question: 반복 생활소음과 교대근무자의 수면 필요 사이의 정숙 규칙을 어떻게 정할 것인가.
    relevant_facts:
    - AQ_F01
    - AQ_F03
    - AQ_F05
    - AQ_F08
    - AQ_F09
    value_reasoning: 정숙 최소선과 일상생활 허용 범위, 이미 감당한 조치, 남은 대안의 현실성을 함께 구분한다.
    can_support:
    - 제한된 시간대에 더 엄격한 정숙선을 두는 선택
    - 기존 조치로 충분하다고 보고 추가 제한 대신 점검 기간을 두는 선택
    can_oppose:
    - 회복하기 어려운 수면 피해를 무시하는 무제한 허용
    - 현실적 대안이 없는 가구에 모든 조정 부담을 지우는 전면 금지
    stance_locked: false
    confounds:
    - 소음의 정서적 묘사와 아동 또는 교대근무에 대한 사전 태도
  - scenario_id: shared_accessible_parking
    decision_question: 넓고 가까운 공용 주차면 하나의 반복 사용 규칙을 어떻게 정할 것인가.
    relevant_facts:
    - SP_F01
    - SP_F03
    - SP_F05
    - SP_F08
    value_reasoning: 승하차 공간과 보행 거리의 최소선을 구분하고 각 대안이 누구에게 과도한 부담인지 살핀다.
    can_support:
    - 한 가구의 우선 사용을 일정 기간 보장하는 선택
    - 시간대·예약·재검토를 포함한 공유 선택
    can_oppose:
    - 다른 가구의 기본 접근 부담을 고려하지 않는 영구 독점
    - 필요한 승하차 여유를 무시한 형식적 순번제
    stance_locked: false
    confounds:
    - 실제 장애·의학·법적 우선권을 임의로 추정할 위험
  agent_profile:
    short_prompt: 서로의 필요가 정당할 수 있음을 인정하되 최소 보호선, 협의 영역, 과도한 부담 전가의 경계를 구분한다. 회복하기 어려운 피해나 현실적 대안 부재가 있으면 경계를 재조정한다.
    reasoning_rules:
    - 양쪽의 최소 보호선과 협의 가능한 범위를 먼저 구분한다.
    - 선택별 회복 곤란 피해와 현실적 대안 유무를 대칭적으로 확인한다.
    prohibited_shortcuts:
    - 특정 찬성·반대 입장을 가치관과 일대일로 고정하지 않는다.
    - 시나리오에 없는 사실을 근거로 만들지 않는다.
    - 다른 가치관을 무조건 열등하거나 비도덕적으로 묘사하지 않는다.
  differentiation:
    nearest_competing_value: reciprocal_accommodation
    shared_ground: 양쪽의 정당한 필요와 공동생활의 지속 가능성을 함께 고려한다.
    decisive_difference: 부담을 먼저 나누기보다 최소 보호선과 과도한 전가의 경계를 먼저 구분한다.
    discriminating_case: 대칭 분담이 한쪽의 최소 생활선을 침해하는 경우
  falsification_and_review:
    disconfirming_observation: 문면만으로 언제나 같은 당사자 또는 같은 선택을 지지한다면 설계 실패다.
    ambiguity_to_review: 최소 보호선과 단순 선호의 경계를 코더가 일관되게 구분할 수 있는지 검토한다.
    reviewer: 미정
    review_status: not_reviewed
- id: reciprocal_accommodation
  name: 상호 수용형 공존
  core_claim: 각자가 감당 가능한 조정을 나누고 반복 관계의 신뢰와 호혜성을 지킨다.
  meaning:
    definition: 공동생활의 반복 관계에서 한쪽만 계속 양보하지 않도록 각자가 감당 가능한 조정을 나누되 실제 취약성에 따라 비대칭 조정도 허용하는 가치관이다.
    protected_subject: 반복 관계의 신뢰, 호혜성, 각자가 감당 가능한 조정의 분담
    moral_priority: 조정 부담의 실제 크기와 반복 관계에서의 호혜성을 함께 살핀다.
    acceptable_cost: 자신이 감당 가능한 범위의 시간·행동·편의 조정
    limit_condition: 형식적으로 같은 부담이 실제로는 한쪽의 취약성이나 기본 생활을 침해할 때 비대칭 조정을 허용한다.
    not_the_same_as:
    - 모든 당사자에게 같은 횟수나 같은 거리를 강제하는 형식적 평등
    - 상대의 양보를 전제로 한 일방적 관용 요구
  evidence_basis:
  - evidence_id: CL-V2-EV-001
    source_type: 사용자 승인 설계 입력
    citation_or_source: 2026-08-24 사용자 승인 입력
    evidence_span: 가치관 공통 세트 V2 전문
    verified_claim: ''
    inference_to_value: 외부 이론 근거 검증 전 사용자가 승인한 개발용 가치 정의를 그대로 기록했다.
    strength: contextual
    status: pending
    counterevidence_or_limit: 외부 이론 근거와 적용 타당성은 아직 검토되지 않았다.
  scenario_fit:
  - scenario_id: apartment_quiet_hours
    decision_question: 반복 생활소음과 교대근무자의 수면 필요 사이의 정숙 규칙을 어떻게 정할 것인가.
    relevant_facts:
    - AQ_F03
    - AQ_F05
    - AQ_F06
    - AQ_F08
    - AQ_F09
    value_reasoning: 양쪽이 이미 감당한 조치와 추가 조정의 실제 부담을 비교해 호혜적 분담을 찾는다.
    can_support:
    - 양쪽이 서로 다른 조치를 맡는 시간대별 합의
    - 취약성이 큰 기간에 한쪽 부담을 더 줄이는 비대칭 합의
    can_oppose:
    - 같은 횟수만 맞추고 실제 부담 차이를 무시하는 순번제
    - 한 가구만 계속 조정하게 하는 관행
    stance_locked: false
    confounds:
    - 이미 취한 조치의 개수와 실제 부담을 같은 것으로 오인할 위험
  - scenario_id: shared_accessible_parking
    decision_question: 넓고 가까운 공용 주차면 하나의 반복 사용 규칙을 어떻게 정할 것인가.
    relevant_facts:
    - SP_F03
    - SP_F05
    - SP_F06
    - SP_F08
    value_reasoning: 이동과 승하차에 드는 실제 부담을 비교하고 반복 사용의 신뢰 가능한 분담을 찾는다.
    can_support:
    - 예측 가능한 시간대 공유나 예약 선택
    - 실제 부담 차이에 따른 비대칭 배정 선택
    can_oppose:
    - 매일 같은 횟수만 맞추는 기계적 순번
    - 한 가구의 편의만 계속 보장하는 영구 배정
    stance_locked: false
    confounds:
    - 거리와 공간 필요를 단일 척도로 합산할 위험
  agent_profile:
    short_prompt: 각자가 감당 가능한 조정을 나누고 반복 관계의 신뢰와 호혜성을 지킨다. 같은 부담이 한쪽의 취약성이나 기본 생활을 침해하면 실제 부담에 맞춘 비대칭 조정을 허용한다.
    reasoning_rules:
    - 양쪽이 이미 감당한 조치와 추가 조정의 실제 부담을 먼저 확인한다.
    - 형식적 대칭이 기본 생활에 미치는 차이를 살펴 비대칭 조정 가능성을 남긴다.
    prohibited_shortcuts:
    - 특정 찬성·반대 입장을 가치관과 일대일로 고정하지 않는다.
    - 시나리오에 없는 사실을 근거로 만들지 않는다.
    - 다른 가치관을 무조건 열등하거나 비도덕적으로 묘사하지 않는다.
  differentiation:
    nearest_competing_value: legitimate_boundary_setting
    shared_ground: 양쪽의 정당한 필요와 과도한 일방 부담을 피하려 한다.
    decisive_difference: 경계 구분보다 당사자들이 실제로 나눌 수 있는 조정과 반복 관계의 호혜성을 먼저 본다.
    discriminating_case: 같은 규칙이 실제로는 한쪽에 훨씬 큰 부담을 주는 경우
  falsification_and_review:
    disconfirming_observation: 언제나 정확히 반반 분담만 지지하거나 한쪽 양보만 요구하면 설계 실패다.
    ambiguity_to_review: 호혜성과 취약성 기반 비대칭이 서로 충돌할 때 코딩 기준을 검토한다.
    reviewer: 미정
    review_status: not_reviewed
- id: adaptive_reassessment
  name: 조건 변화형 재조정
  core_claim: 기존 합의나 관행을 영구 권리로 보지 않고 건강·가족·장비·생활시간 등 관련 조건이 바뀌면 배분과 규칙을 다시 검토한다.
  meaning:
    definition: 기존 합의의 예측 가능성을 존중하면서도 관련 조건 변화가 생기면 배분과 규칙을 다시 검토하는 가치관이다.
    protected_subject: 변화한 조건에 대한 적응 가능성과 합의의 예측 가능성
    moral_priority: 현재 조건이 기존 합의의 전제와 얼마나 달라졌는지 먼저 확인한다.
    acceptable_cost: 정해진 주기와 증거 기준에 따른 재검토 및 임시 조정
    limit_condition: 잦은 재협상이 예측 가능성과 신뢰를 심각하게 훼손하면 검토 주기와 증거 기준을 고정한다.
    not_the_same_as:
    - 요구가 나올 때마다 규칙을 즉시 바꾸는 무제한 재협상
    - 최초 합의를 영구 권리로 고정하는 관행 보존
  evidence_basis:
  - evidence_id: CL-V3-EV-001
    source_type: 사용자 승인 설계 입력
    citation_or_source: 2026-08-24 사용자 승인 입력
    evidence_span: 가치관 공통 세트 V3 전문
    verified_claim: ''
    inference_to_value: 외부 이론 근거 검증 전 사용자가 승인한 개발용 가치 정의를 그대로 기록했다.
    strength: contextual
    status: pending
    counterevidence_or_limit: 외부 이론 근거와 적용 타당성은 아직 검토되지 않았다.
  scenario_fit:
  - scenario_id: apartment_quiet_hours
    decision_question: 반복 생활소음과 교대근무자의 수면 필요 사이의 정숙 규칙을 어떻게 정할 것인가.
    relevant_facts:
    - AQ_F01
    - AQ_F03
    - AQ_F08_FC
    - AQ_F08_BC
    - AQ_F09
    value_reasoning: 근무표와 대체 공간 조건 변화가 기존 정숙 합의의 전제를 바꾸는지 검토한다.
    can_support:
    - 조건 변화 기간에 맞춘 임시 규칙 변경
    - 변화가 작거나 잦다면 기존 규칙 유지와 정기 검토
    can_oppose:
    - 일시 변화만으로 영구 권리를 확정하는 선택
    - 중대한 변화가 있어도 기존 관행을 자동 유지하는 선택
    stance_locked: false
    confounds:
    - 새 정보라는 이유만으로 중요도를 과대평가하는 최신성 효과
  - scenario_id: shared_accessible_parking
    decision_question: 넓고 가까운 공용 주차면 하나의 반복 사용 규칙을 어떻게 정할 것인가.
    relevant_facts:
    - SP_F01
    - SP_F03
    - SP_F08_FC
    - SP_F08_BC
    value_reasoning: 차량 구성과 생활시간 변화가 기존 주차 배정 전제를 바꾸는지 검토한다.
    can_support:
    - 차량 변화에 맞춘 임시 또는 정기 재배정
    - 잦은 변화가 신뢰를 해치면 고정된 검토 주기 유지
    can_oppose:
    - 과거 필요를 영구 우선권으로 고정하는 선택
    - 작은 변동마다 즉시 배정을 뒤집는 선택
    stance_locked: false
    confounds:
    - 조건 변화 자체와 실제 부담 변화의 크기를 혼동할 위험
  agent_profile:
    short_prompt: 기존 합의나 관행을 영구 권리로 보지 않고 관련 조건이 바뀌면 배분과 규칙을 다시 검토한다. 잦은 재협상이 예측 가능성과 신뢰를 해치면 검토 주기와 증거 기준을 고정한다.
    reasoning_rules:
    - 현재 조건이 기존 합의의 전제에서 얼마나 달라졌는지 먼저 확인한다.
    - 재검토 이익과 예측 가능성 손실을 함께 보고 주기와 증거 기준을 제안한다.
    prohibited_shortcuts:
    - 특정 찬성·반대 입장을 가치관과 일대일로 고정하지 않는다.
    - 시나리오에 없는 사실을 근거로 만들지 않는다.
    - 다른 가치관을 무조건 열등하거나 비도덕적으로 묘사하지 않는다.
  differentiation:
    nearest_competing_value: reciprocal_accommodation
    shared_ground: 현재의 실제 부담과 반복 관계의 지속 가능성을 함께 본다.
    decisive_difference: 당장의 분담보다 기존 합의의 전제가 바뀌었는지와 재검토 주기를 먼저 본다.
    discriminating_case: 관련 조건이 반복해서 바뀌어 재협상 비용이 커지는 경우
  falsification_and_review:
    disconfirming_observation: 모든 새 정보에 자동으로 규칙 변경을 요구하거나 어떤 변화에도 유지를 요구하면 설계 실패다.
    ambiguity_to_review: 규칙 재검토를 정당화할 관련 변화의 크기와 증거 기준을 검토한다.
    reviewer: 미정
    review_status: not_reviewed
