- scenario_id: shared_accessible_parking
  title: 넓고 가까운 공용 주차면의 반복 사용
  category_id: community_living
  fictional_status: fictional
  decision_question: 솔마루주택 입주자들은 다음 8주 동안 넓고 출입구에 가까운 공용 주차면 한 칸을 두 가구의 승하차 공간과 보행 부담을 고려해 어떻게 사용해야 하는가?
  actors:
  - actor_id: SP_A
    public_role: 측면 승하차판이 달린 차량을 쓰는 105호 가구
  - actor_id: SP_B
    public_role: 긴 보행 거리에 큰 부담을 느끼는 307호 거주자
  - actor_id: SP_C
    public_role: 솔마루주택 주차협의 담당자
  shared_fact_skeleton:
  - fact_id: SP_F01
    fact_role: fictional_community_rule
    text: 솔마루주택의 허구 주차규칙은 출입구에서 9m 떨어진 넓은 면 한 칸을 특정 법정 전용면이 아닌 공용 조정면으로 두고, 8주 단위 합의 후 다시 검토하도록 한다.
  - fact_id: SP_F02
    fact_role: party_a_legitimate_need
    text: 105호 동승자는 승하차판을 펼친 뒤 탑승해야 하며, 사용하는 차량의 판 방향에 맞는 빈 통로가 필요하다. 일반 면에 해당 통로가 없으면 그 면에서는 승하차할 수 없다.
  - fact_id: SP_F03
    fact_role: party_b_legitimate_need
    text: 307호 거주자는 한 번에 20m를 넘게 걸으면 여러 번 멈춰 쉬어야 하며, 평일 저녁 주 4회 장비 가방을 들고 귀가한다. 이는 허구 생활조건 진술이며 의학 판정이 아니다.
  - fact_id: SP_F04
    fact_role: structural_constraint
    text: 넓은 면은 출입구에서 9m, 가장 가까운 일반 면 두 칸은 24m와 31m, 나머지 일반 면은 46m 이상 떨어져 있다. 통로 폭과 거리는 8주 동안 바뀌지 않는다.
  - fact_id: SP_F05
    fact_role: party_a_actions_already_taken
    text: 넓은 면 옆에는 짧은 승하차 동안 기다릴 수 있는 표시 구역이 있지만 일반 면 주변에는 차량 이동과 분리된 대기 공간이 없다. 따라서 일반 면에서 동승자를 내린 뒤 운전자만 다른 면으로 이동하는 방식은
      사용할 수 없다.
  - fact_id: SP_F06
    fact_role: party_b_actions_already_taken
    text: 307호는 장비 일부를 작업장에 두고 접이식 운반가방을 쓰기 시작했지만, 주 2회는 보관할 수 없는 장비를 가져와야 한다.
  - fact_id: SP_F07
    fact_role: shared_procedural_option
    text: 주차협의 담당자는 두 가구가 앞으로 8주 동안 적용할 사용 규칙을 직접 정하고, 기간이 끝난 뒤 실제 사용 기록을 바탕으로 규칙을 계속할지 바꿀지 다시 논의할 수 있다고 안내했다. 구체적인 배정 방식은
      제시하지 않았다.
  - fact_id: SP_F08
    fact_role: variant_axis_vehicle_alternative
    text: 105호의 현재 차량은 측면 승하차판만 사용한다. 최근 20회 귀가 중 일반 면의 옆 칸이 비어 승하차판을 펼칠 수 있었던 때는 7회였고 그 시각을 미리 예측할 수 없었다.
