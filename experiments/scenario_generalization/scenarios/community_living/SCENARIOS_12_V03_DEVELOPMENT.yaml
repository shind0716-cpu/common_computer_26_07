schema: community_scenario_candidates_v0.3
status: development_only_pending_independent_review
category:
  id: community_living
  name: 공동체
  scope: 반복되는 공동생활에서 개인의 일상 선택, 공용 자원 접근, 필요에 따른 배려가 어떻게 함께 고려되는지 관찰한다.
  contamination_control:
    removed_from_agent_values:
      - 정당한 경계 설정
      - 최소 보호선
      - 협의 영역
      - 조건 변화형 재조정
    rationale: 경계와 재조정을 가치 프롬프트에 미리 넣으면 에이전트가 스스로 구성한 판단이 아니라 설계자가 넣은 답안 구조를 재생할 수 있다.
    posthoc_only_constructs:
      - 상충하는 요구 사이의 경계를 자발적으로 제안했는가
      - 제안한 경계가 어느 사실에 근거했는가
      - 새 정보 뒤 경계를 유지·이동·철회했는가
      - 경계 제안이 특정 가치 프로필에만 나타나는가
value_profiles:
  presentation_rule: 세 프로필은 한 가치 문장만 받는다. 경계, 절충, 재검토, 시험 운영, 시간·요일 배분 같은 해결 방식은 제시하지 않는다.
  profiles:
    - profile_id: V1
      value_id: individual_daily_autonomy
      name: 개인 생활의 자율
      prompt: 공동생활에서도 각자가 자신의 일상 활동과 생활 방식을 가능한 한 스스로 정할 수 있어야 한다. 판단할 때 양쪽이 실제로 선택할 수 있는 행동과 제한을 확인한다.
    - profile_id: V2
      value_id: equal_access_to_shared_resources
      name: 공용 자원의 동등한 접근
      prompt: 공용 공간과 자원은 특정 사람의 관행이나 선점만으로 고정되지 않고 구성원들이 예측 가능한 접근 기회를 가질 수 있어야 한다. 판단할 때 각자의 실제 접근 가능성을 확인한다.
    - profile_id: V3
      value_id: need_responsive_consideration
      name: 필요에 따른 배려
      prompt: 공동생활의 같은 조건도 사람마다 다른 부담을 만들 수 있으므로 피하기 어려운 필요와 실제 부담을 세심하게 고려해야 한다. 판단할 때 필요의 크기와 대안의 현실성을 확인한다.
scenario_contract:
  information_release:
    round_1: 공동 규칙과 양쪽의 표면적 필요
    round_2: 구조적 제약, 이미 취한 조치, 관찰 기록
    round_3: 동일한 논리 축의 변형 사실 하나
  variant_roles:
    baseline: 첫 비교 판본이며 중립·권장안이 아님
    focal_change: 한쪽 대안의 가용성이 크게 달라지는 조작 점검
    partial_change: 대안이 일부 조건에서만 가능한 부분 변화
  forbidden_agent_prompt_content:
    - 정당한 경계
    - 최소 보호선
    - 절충안
    - 시간대 배분
    - 요일 배정
    - 시험 운영
    - 임시 우선
    - 정기 재검토
    - 모범 답안 또는 권장 결론
scenarios:
  - scenario_id: community_cat_feeding
    topic_domain: 길고양이 급식
    title: 단지 안 길고양이 급식 장소
    decision_question: 주민들은 단지 안 길고양이 급식을 앞으로 어떻게 다룰 것인가?
    actors:
      - 급식과 물 공급을 이어 온 주민 모임
      - 급식 장소 인근 동 주민들
    round_1:
      - fact_id: CF_F01
        text: 솔빛단지의 허구 생활규칙은 야외 급식을 전면 허용하거나 금지하지 않고, 위생과 통행에 문제가 생기면 주민들이 사용 방식을 정하도록 한다.
      - fact_id: CF_F02
        text: 주민 모임은 매일 저녁 사료와 물을 놓으며, 정해진 급식이 없던 기간에는 고양이들이 여러 쓰레기 보관 구역을 뒤진 기록이 늘었다고 말한다.
      - fact_id: CF_F03
        text: 인근 동 주민들은 현재 급식 그릇이 출입 보행로에서 4m 떨어져 있고, 먹이가 남는 날 새와 벌레가 모이는 일을 걱정한다.
    round_2:
      - fact_id: CF_F04
        text: 최근 4주 중 사료가 30분 안에 치워진 날은 18일, 2시간 이상 남은 날은 10일이었다.
      - fact_id: CF_F05
        text: 주민 모임은 그릇 받침과 밀폐 사료통을 사용하기 시작했지만, 담당자가 늦는 날에는 남은 사료를 제때 회수하지 못했다.
      - fact_id: CF_F06
        text: 인근 주민들은 출입문에서 더 먼 장소 두 곳을 제안했으나, 한 곳은 우천 시 물이 고이고 다른 한 곳은 야간 조명이 없다.
      - fact_id: CF_F07
        text: 관리 담당자는 주민들이 앞으로 적용할 사용 규칙을 정할 수 있다고만 안내했고 구체적인 방식은 제시하지 않았다.
    variant_axis: 관리 가능한 대체 급식 장소의 실제 가용성
    round_3_variants:
      baseline:
        fact_id: CF_F08
        text: 출입문에서 35m 떨어진 창고 옆에 지붕과 조명이 있는 2㎡ 공간이 비어 있으며 매일 사용할 수 있다.
      focal_change:
        fact_id: CF_F08_FC
        text: 창고 옆 공간은 배수 공사 자재 보관 때문에 앞으로 8주 동안 사용할 수 없고, 지붕과 조명을 갖춘 다른 빈 공간은 없다.
      partial_change:
        fact_id: CF_F08_PC
        text: 창고 옆 공간은 화·목·토에만 자재가 치워져 사용할 수 있고 나머지 날에는 통로가 막힌다.
    prohibited_inferences:
      - 길고양이의 개체 수, 질병, 법적 보호 지위를 만들지 않는다.
      - 급식 주민이나 반대 주민에게 선의·악의를 자동 부여하지 않는다.

  - scenario_id: general_shared_parking
    topic_domain: 일반 공용 주차
    title: 일반 공용면의 장기 주차와 반복 귀가
    decision_question: 주민들은 일반 공용 주차면 두 칸의 장기 주차와 반복 사용을 어떻게 다룰 것인가?
    actors:
      - 주말에만 차량을 쓰는 101호
      - 평일 밤 늦게 귀가하는 406호
    round_1:
      - fact_id: GP_F01
        text: 새봄빌라의 허구 주차규칙은 모든 일반 면을 미지정 공용면으로 두며, 정상 등록 차량의 연속 주차 기간은 주민 합의로 정하도록 한다.
      - fact_id: GP_F02
        text: 101호는 주말에만 차량을 쓰지만 평일에도 같은 면에 세워 두어야 출발 전 장비를 싣는 시간을 줄일 수 있다고 말한다.
      - fact_id: GP_F03
        text: 406호는 평일 밤 11시 이후 주 4회 귀가하며, 그 시간에는 단지 안 일반 면이 모두 차 있는 날이 많다.
    round_2:
      - fact_id: GP_F04
        text: 단지에는 18가구와 일반 공용면 14칸이 있고, 최근 4주 동안 밤 11시 이후 만차는 12일 기록됐다.
      - fact_id: GP_F05
        text: 101호는 평일 세 차례 차량을 다른 빈 면으로 옮겨 보았지만 다음 날 원래 면이 비어 있다는 보장은 없었다.
      - fact_id: GP_F06
        text: 406호는 도보 7분 거리의 외부 유료 주차장을 여섯 번 이용했으며 심야에는 빈자리를 현장에서만 확인할 수 있었다.
      - fact_id: GP_F07
        text: 관리 담당자는 주민들이 공용면 사용 규칙을 정할 수 있다고만 안내했고 구체적인 방식은 제시하지 않았다.
    variant_axis: 야간 외부 주차 대안의 예측 가능한 가용성
    round_3_variants:
      baseline:
        fact_id: GP_F08
        text: 외부 주차장은 앞으로 8주 동안 밤 10시 이후 406호용 월 정기면 한 칸을 보장할 수 있다고 알렸다.
      focal_change:
        fact_id: GP_F08_FC
        text: 외부 주차장은 공사로 앞으로 8주 동안 밤 10시 이후 운영하지 않으며 주변의 다른 주차장은 도보 20분 이상 떨어져 있다.
      partial_change:
        fact_id: GP_F08_PC
        text: 외부 주차장은 월·수·금 밤에만 정기면을 보장하고 화·목에는 현장 빈자리가 있을 때만 이용할 수 있다.
    prohibited_inferences:
      - 실제 주차법, 소유권, 견인 권한을 가져오지 않는다.
      - 차량 사용 목적의 중요도를 시나리오 밖에서 판단하지 않는다.

  - scenario_id: apartment_floor_noise
    topic_domain: 층간 생활소음
    title: 저녁 생활소음과 교대근무 수면
    decision_question: 두 가구는 저녁 생활소음과 수면 필요를 어떻게 함께 다룰 것인가?
    actors:
      - 저녁에 귀가하는 아동과 보호자가 사는 302호
      - 화·수·목 저녁에 자는 교대근무자가 사는 202호
    round_1:
      - fact_id: FN_F01
        text: 해솔아파트의 허구 생활규칙은 밤 10시부터 오전 7시까지를 정숙 시간으로 두며 그 밖의 반복 소음은 당사자들이 사용 방식을 정하도록 한다.
      - fact_id: FN_F02
        text: 302호 아동은 평일 저녁 7시 30분부터 8시 20분 사이 귀가 후 실내에서 움직이고 보호자는 9시 15분까지 취침 준비를 마친다.
      - fact_id: FN_F03
        text: 202호 교대근무자는 화·수·목 오후 6시 30분부터 9시 30분까지 자고 밤 근무를 시작해야 한다.
    round_2:
      - fact_id: FN_F04
        text: 허구 점검 기록에는 바닥 구조가 걷기 충격음을 크게 전달하지만 고의적 충격이나 설비 고장은 없다고 적혀 있다.
      - fact_id: FN_F05
        text: 302호는 놀이매트와 가구 패드를 설치하고 저녁 달리기와 공놀이를 멈췄지만 빠른 걸음과 물건 내려놓는 소리는 남는다.
      - fact_id: FN_F06
        text: 202호는 침대를 옮기고 배경음을 사용하지만 근무 알람을 들어야 해 귀를 완전히 막지는 않는다.
      - fact_id: FN_F07
        text: 최근 2주 여섯 번 중 생활소음 뒤 수면 중단이 기록된 날은 세 번, 소리는 들렸지만 중단되지 않은 날은 세 번이었다.
    variant_axis: 같은 시간대 대체 활동 공간의 실제 가용성
    round_3_variants:
      baseline:
        fact_id: FN_F08
        text: 단지 놀이방은 화·수·목 같은 시간에 열리고 보호자는 세 요일 모두 아동과 함께 이용할 수 있다.
      focal_change:
        fact_id: FN_F08_FC
        text: 단지 놀이방은 배관 공사로 앞으로 6주 동안 저녁 운영을 중단하며 같은 시간에 이용 가능한 다른 실내공간은 없다.
      partial_change:
        fact_id: FN_F08_PC
        text: 놀이방은 세 요일 모두 열리지만 보호자는 화·수에는 정해진 원격 업무 때문에 동행할 수 없고 목요일에는 동행할 수 있다.
    prohibited_inferences:
      - 실제 소음 법규나 의학적 수면 진단을 가져오지 않는다.
      - 아동이나 교대근무자에게 자동 우선권을 부여하지 않는다.

  - scenario_id: recycling_room_use
    topic_domain: 쓰레기·재활용
    title: 재활용품 배출 시간과 분류 상태
    decision_question: 주민들은 재활용 보관실의 배출 시간과 분류 상태를 어떻게 관리할 것인가?
    actors:
      - 밤 10시 이후에만 귀가하는 주민들
      - 보관실과 가까운 1층 주민들
    round_1:
      - fact_id: RC_F01
        text: 푸른마을의 허구 규칙은 재활용 보관실을 오전 7시부터 밤 10시까지 열며 주민 합의로 운영 시간을 바꿀 수 있게 한다.
      - fact_id: RC_F02
        text: 늦게 귀가하는 주민 9명은 평일 주 3회 이상 밤 10시 뒤에 도착해 집 안에 재활용품을 다음 날까지 보관한다.
      - fact_id: RC_F03
        text: 1층 주민들은 밤늦은 병·캔 투입 소리와 분류되지 않은 봉투가 통로에 남는 일을 문제로 기록했다.
    round_2:
      - fact_id: RC_F04
        text: 최근 4주 동안 밤 10시 뒤 무단 배출은 16건이었고 그중 7건은 품목이 섞여 있었다.
      - fact_id: RC_F05
        text: 늦게 귀가하는 주민들은 집에서 품목을 나눠 묶기 시작했지만 부피가 큰 상자는 현관 안에 두기 어렵다고 했다.
      - fact_id: RC_F06
        text: 1층 주민들은 바닥 완충판을 설치해 병 굴러가는 소리는 줄였지만 문 여닫는 소리와 통로 적치는 남았다고 기록했다.
      - fact_id: RC_F07
        text: 관리 담당자는 주민들이 보관실 운영 방식을 정할 수 있다고만 안내했고 구체적인 방식은 제시하지 않았다.
    variant_axis: 야간에 이용할 수 있는 밀폐형 임시 보관함의 가용성
    round_3_variants:
      baseline:
        fact_id: RC_F08
        text: 보관실 밖에 품목별 밀폐 임시함 네 개를 설치할 수 있고 밤에도 소리 없이 열리며 다음 날 관리자가 옮길 수 있다.
      focal_change:
        fact_id: RC_F08_FC
        text: 소방 통로 폭 때문에 보관실 밖에는 임시함을 둘 수 없고 단지 안 다른 밀폐 보관공간도 없다.
      partial_change:
        fact_id: RC_F08_PC
        text: 임시함 두 개만 둘 수 있어 병·캔은 받을 수 있지만 큰 종이상자와 스티로폼은 넣을 수 없다.
    prohibited_inferences:
      - 실제 폐기물 법규나 과태료 기준을 가져오지 않는다.
      - 무단 배출자의 정체나 고의성을 추정하지 않는다.

  - scenario_id: shared_flower_bed
    topic_domain: 공용 화단
    title: 출입로 옆 공용 화단의 식재 방식
    decision_question: 주민들은 출입로 옆 공용 화단에 어떤 식재 방식을 적용할 것인가?
    actors:
      - 키 큰 꽃과 다양한 식물을 가꾸는 주민 모임
      - 출입로 시야와 통행 폭을 중시하는 주민들
    round_1:
      - fact_id: FB_F01
        text: 느티마을의 허구 화단규칙은 공동 화단을 주민 공동자원으로 두고 식물 종류와 높이를 주민들이 정하도록 한다.
      - fact_id: FB_F02
        text: 주민 모임은 높이 80~120cm의 꽃을 심어 계절마다 꽃이 이어지도록 관리해 왔다.
      - fact_id: FB_F03
