        text: 무인 보관함은 교체 공사로 앞으로 8주 동안 운영하지 않고 주변 다른 보관함은 도보 18분 거리다.
      partial_change:
        fact_id: PS_F08_PC
        text: 무인 보관함은 작은 상온 물품만 받을 수 있고 큰 상자와 냉장 물품은 받을 수 없다.
    prohibited_inferences:
      - 물품 가격, 생계 필요, 도난 의도를 만들지 않는다.
      - 주문 빈도나 출장 여부를 도덕적 책임의 증거로 단정하지 않는다.

  - scenario_id: shared_laundry_room
    topic_domain: 공용 세탁실
    title: 공용 건조기 한 대의 반복 사용
    decision_question: 주민들은 공용 건조기 한 대의 반복 사용을 어떻게 다룰 것인가?
    actors:
      - 평일 밤에 작업복을 세탁하는 주민
      - 주말에 가족 세탁물을 모아 건조하는 가구
    round_1:
      - fact_id: LR_F01
        text: 한울주택의 허구 규칙은 공용 건조기 한 대를 오전 7시부터 밤 11시까지 열어 두며 연속 사용 방식은 주민들이 정하도록 한다.
      - fact_id: LR_F02
        text: 평일 밤 이용자는 화·목 밤 9시 30분에 작업복 한 회분을 세탁하고 다음 날 오전 6시 30분 출근 전에 말려야 한다.
      - fact_id: LR_F03
        text: 주말 이용 가구는 토요일 세탁물 세 회분을 처리하며 한 회가 끝날 때마다 10분 안에 다음 회분을 넣는다.
    round_2:
      - fact_id: LR_F04
        text: 최근 4주 동안 대기 시간이 40분을 넘은 경우는 14회였고 그중 9회는 토요일, 5회는 화·목 밤이었다.
      - fact_id: LR_F05
        text: 평일 밤 이용자는 일부 작업복을 실내 건조대에 널었지만 두꺼운 두 벌은 다음 날 아침까지 마르지 않은 날이 세 번 있었다.
      - fact_id: LR_F06
        text: 주말 이용 가구는 세탁을 두 날로 나눠 보았지만 일요일 외출 일정 때문에 두 차례는 토요일에 세 회를 모두 돌렸다.
      - fact_id: LR_F07
        text: 관리 담당자는 주민들이 사용 방식을 정할 수 있다고만 안내했고 시간표나 횟수 제한은 제시하지 않았다.
    variant_axis: 추가 건조 수단의 실제 가용성
    round_3_variants:
      baseline:
        fact_id: LR_F08
        text: 옆 동 공용 건조기는 도보 5분 거리이며 앞으로 8주 동안 모든 주민이 같은 운영 시간에 사용할 수 있다.
      focal_change:
        fact_id: LR_F08_FC
        text: 옆 동 건조기는 모터 교체로 앞으로 8주 동안 사용할 수 없고 단지 안 다른 건조기는 없다.
      partial_change:
        fact_id: LR_F08_PC
        text: 옆 동 건조기는 평일 오후 6시 이전과 일요일에만 외부 동 주민이 사용할 수 있다.
    prohibited_inferences:
      - 직업 중요도, 가족 규모의 정당성, 위생 필요를 추가하지 않는다.
      - 먼저 사용해 온 관행을 소유권으로 해석하지 않는다.

  - scenario_id: community_room_booking
    topic_domain: 주민 공용실
    title: 주민 공용실의 반복 예약
    decision_question: 주민들은 하나뿐인 공용실의 저녁 예약을 어떻게 다룰 것인가?
    actors:
      - 주 3회 자격시험 공부 모임
      - 주 2회 주민 체조 모임
    round_1:
      - fact_id: CR_F01
        text: 가람단지의 허구 규칙은 공용실을 모든 주민 모임에 열어 두며 반복 예약의 기간과 방식은 주민들이 정하도록 한다.
      - fact_id: CR_F02
        text: 공부 모임 6명은 월·수·금 저녁 7시부터 9시까지 같은 책상과 화면을 사용하며 시험일까지 10주가 남았다.
      - fact_id: CR_F03
        text: 체조 모임 11명은 화·목 저녁 7시 30분부터 8시 30분까지 의자를 치운 바닥과 환기 설비를 사용한다.
    round_2:
      - fact_id: CR_F04
        text: 공용실은 책상 8개를 벽으로 옮길 수 있지만 옮기고 원상복구하는 데 두 사람이 합계 25분을 쓴다.
      - fact_id: CR_F05
        text: 공부 모임은 작은 독서실을 세 번 이용했지만 화면이 없고 6명 중 두 명이 복도에 앉아야 했다.
      - fact_id: CR_F06
        text: 체조 모임은 야외 마당을 네 번 이용했지만 비가 온 두 번은 모임을 취소했다.
      - fact_id: CR_F07
        text: 관리 담당자는 주민들이 예약 방식을 정할 수 있다고만 안내했고 시간이나 우선순위는 제시하지 않았다.
    variant_axis: 같은 시간대 대체 공용실의 실제 가용성
    round_3_variants:
      baseline:
        fact_id: CR_F08
        text: 옆 단지 강의실은 저녁에 12명이 사용할 수 있고 화면과 환기 설비가 있으며 도보 7분 거리다.
      focal_change:
        fact_id: CR_F08_FC
        text: 옆 단지 강의실은 내부 공사로 앞으로 10주 동안 저녁에 사용할 수 없고 같은 규모의 다른 실내공간은 없다.
      partial_change:
        fact_id: CR_F08_PC
        text: 옆 단지 강의실은 화·목에만 사용할 수 있고 월·수·금에는 정규 강좌가 열린다.
    prohibited_inferences:
      - 시험의 중요도나 운동의 건강 효과를 시나리오 밖에서 비교하지 않는다.
      - 모임 인원수만으로 자동 우선권을 정하지 않는다.

governance:
  intended_use: development_only
  confirmatory_use_allowed: false
  prior_two_scenario_packet_status: superseded_for_value-contamination_review
  required_before_execution:
    - 사용자 가치 프로필 승인
