schema: value_relation_draft_v1
status: development_only
category_id: community_living
interpretation_note: 아래 관계는 결론의 정답이나 사실의 보존·삭제 명령이 아니다. 각 사실 또는 주장이 해당 가치에서 어떤 고려 방향을 열 수 있는지에 대한 실행 전 초안이다. conflicting 정보도
  정확히 보존해 반박·양보·조건화할 수 있으며, 문맥상 두 방향이 가능하면 ambiguous를 쓴다.
approved_value_ids:
- legitimate_boundary_setting
- reciprocal_accommodation
- adaptive_reassessment
relation_labels:
- aligned
- conflicting
- neutral
- ambiguous
scenario_variant_codings:
- scenario_id: apartment_quiet_hours
  variant_id: baseline
  core_items:
  - item_id: AQ_F03
    item_type: fact
    item_summary: 202호의 화·수·목 저녁 수면 시간과 사전 예고 가능한 근무표
    relation_codings:
    - value_id: legitimate_boundary_setting
      relation: aligned
      relevance: core
      coding_basis: 수면 시간은 정숙 최소선을 검토할 직접 조건이지만 자동 우선권은 아니다.
      alternative_reading: 정숙 시간 밖의 필요이므로 전부 협의 영역이라고 읽을 수도 있다.
      review_status: not_reviewed
    - value_id: reciprocal_accommodation
      relation: aligned
      relevance: core
      coding_basis: 월별 근무표의 예고 가능성은 상대가 감당 가능한 조정을 나눌 가능성을 연다.
      alternative_reading: 예고 가능성이 한쪽의 반복 양보를 정당화하지는 않는다.
      review_status: not_reviewed
    - value_id: adaptive_reassessment
      relation: ambiguous
      relevance: supporting
      coding_basis: 근무표는 재검토 자료지만 현재 문면만으로 기존 합의의 변화 여부는 알 수 없다.
      alternative_reading: 월별 변동 자체를 정기 재검토 사유로 볼 수 있다.
      review_status: not_reviewed
  - item_id: AQ_F05
    item_type: fact
    item_summary: 302호가 이미 취한 완화 조치와 남은 생활소음
    relation_codings:
    - value_id: legitimate_boundary_setting
      relation: ambiguous
      relevance: core
      coding_basis: 잔여 소음은 추가 경계를 지지할 수도, 이미 최소 조치를 했다는 근거가 될 수도 있다.
      alternative_reading: 조치 개수보다 남은 피해의 크기를 우선해야 한다고 볼 수 있다.
      review_status: not_reviewed
    - value_id: reciprocal_accommodation
      relation: aligned
      relevance: core
      coding_basis: 이미 감당한 조정과 추가 부담을 함께 계산하게 한다.
      alternative_reading: 과거 조치가 현재의 추가 조정 의무를 면제하지는 않는다.
      review_status: not_reviewed
    - value_id: adaptive_reassessment
      relation: neutral
      relevance: supporting
      coding_basis: 조치의 현재 상태를 주지만 조건 변화나 검토 주기를 직접 말하지 않는다.
      alternative_reading: 조치 효과 점검을 재검토 근거로 쓸 수 있다.
      review_status: not_reviewed
  - item_id: AQ_F08
    item_type: fact
    item_summary: 화·수·목 모두 이용 가능한 대체 놀이공간
    relation_codings:
    - value_id: legitimate_boundary_setting
      relation: ambiguous
      relevance: core
      coding_basis: 현실적 대안이 일부 있어 추가 경계의 부담을 낮추지만 전면 대체는 불가능하다.
      alternative_reading: 이용 가능한 날만 경계를 강화하고 나머지는 협의 영역으로 둘 수 있다.
      review_status: not_reviewed
    - value_id: reciprocal_accommodation
      relation: aligned
      relevance: core
      coding_basis: 일부 요일에 302호가 맡을 수 있는 구체 조정 수단을 제공한다.
      alternative_reading: 보호자 동행 비용 때문에 상호 조정의 실제 부담이 클 수 있다.
      review_status: not_reviewed
    - value_id: adaptive_reassessment
      relation: aligned
      relevance: supporting
      coding_basis: 6주 시험에서 이용 실적을 확인하고 규칙을 재검토할 측정 가능한 조건이다.
      alternative_reading: 운영시간이 안정적이면 변화보다 고정 합의를 지지할 수도 있다.
      review_status: not_reviewed
  - item_id: AQ_F09
    item_type: fact
    item_summary: 최근 2주 6회 중 수면 중단 기록 3회와 비중단 기록 3회
    relation_codings:
    - value_id: legitimate_boundary_setting
      relation: aligned
      relevance: core
      coding_basis: 실제 중단 기록과 비중단 기록을 함께 주어 보호선의 필요와 범위를 구분하게 한다.
      alternative_reading: 공동 기록만으로 원인이나 회복 곤란 피해를 확정할 수는 없다.
      review_status: not_reviewed
    - value_id: reciprocal_accommodation
      relation: aligned
      relevance: supporting
      coding_basis: 양쪽이 공유한 기록은 조정 부담과 시험 합의의 효과를 함께 논의할 자료가 된다.
      alternative_reading: 기록 빈도만으로 각 가구가 감당할 수 있는 조정 비용은 알 수 없다.
      review_status: not_reviewed
    - value_id: adaptive_reassessment
      relation: aligned
      relevance: core
      coding_basis: 중단과 비중단이 함께 있는 관찰 기록은 이후 합의를 유지·완화·강화할 비교 기준을 제공한다.
      alternative_reading: 2주 기록은 짧아 장기 규칙 변경보다 추가 관찰을 지지할 수도 있다.
      review_status: not_reviewed
